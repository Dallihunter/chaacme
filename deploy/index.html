  .mark { width: 48px; height: 24px; margin: 0 auto 16px; border-radius: 48px 48px 0 0; background: #d9a23a; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 0; color: #5f554a; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>چند لحظه دیگر برمی‌گردیم</h1>

</main>
</body>
</html>
