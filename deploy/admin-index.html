  // ---------------------------------------------------------------------
  // Tour ⇄ partners assignment (inside the tour editor)
  // ---------------------------------------------------------------------
  // A tour has one venue (a place) and any number of people (persons). Both
  // live in the same tour_hosts list, so both are edited here and written by
  // a single PUT: the endpoint replaces the whole list in one transaction,
  // and a half-built list must never be sent.
  const tourHosts = { tourId: null, venueId: null, people: [], loaded: false };

  async function initTourHosts(tourId){
    tourHosts.tourId = tourId;
    tourHosts.venueId = null;
    tourHosts.people = [];
    tourHosts.loaded = false;
    try {
      const [assigned] = await Promise.all([
        api('/admin/tours/' + encodeURIComponent(tourId) + '/hosts'),
        state.hosts.length ? Promise.resolve(null) : loadHosts()
      ]);
      assigned.hosts.forEach(function(h){
        if (h.role === 'venue') tourHosts.venueId = h.hostId;
        else tourHosts.people.push({ hostId: h.hostId, slug: h.slug, displayName: h.displayName, status: h.status, role: h.role, roleLabel: h.roleLabel || '' });
      });
      tourHosts.loaded = true;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      const panel = document.getElementById('tourHostsPanel');
      if (panel) panel.innerHTML = '<div class="empty">بارگذاری پروفایل‌ها ممکن نشد.</div>';
      return;
    }
    drawTourHosts();
  }

  function hostById(id){
    return state.hosts.filter(function(h){ return h.id === id; })[0] || null;
  }

  // A linked profile that is hidden is silently absent from the public page,
  // so say so here rather than let someone assign it and see nothing.
  function hiddenWarning(status){
    return status !== 'active' ? ' — <b>پنهان</b>، روی سایت دیده نمی‌شود' : '';
  }

  function venueSectionHtml(){
    const places = state.hosts.filter(function(h){ return h.kind === 'place'; });
    const current = tourHosts.venueId ? hostById(tourHosts.venueId) : null;
    return '<h3 style="font-size:14px;margin:0 0 10px;">محل برگزاری</h3>' +
      (current
        ? '<div class="th-row">' +
            '<div class="th-name">' + esc(current.displayName) +
              '<small>/host/' + esc(current.slug) +
                (current.region ? ' · ' + esc(current.region) : '') + hiddenWarning(current.status) + '</small></div>' +
            '<button type="button" class="btn small danger" id="tvClear">حذف</button>' +
          '</div>'
        : '') +
      '<div class="th-add">' +
        '<div class="field" style="margin-bottom:0;"><label>' + (current ? 'تغییر محل' : 'انتخاب محل') + '</label>' +
          '<select id="tvPick">' +
            (places.length
              ? '<option value="">هیچ‌کدام</option>' + places.map(function(h){
                  return '<option value="' + h.id + '"' + (h.id === tourHosts.venueId ? ' selected' : '') + '>' +
                    esc(h.displayName) + ' (' + esc(fa(h.status)) + ')</option>';
                }).join('')
              : '<option value="">هنوز مکانی نیست</option>') +
          '</select></div>' +
      '</div>' +
      '<p style="color:var(--ink-muted);font-size:12px;margin:10px 0 24px;">' +
        'هر تجربه در یک مکان برگزار می‌شود. فقط پروفایل‌های نوع <b>مکان</b> اینجا می‌آیند — ' +
        'اگر مکان نیست <a href="#/hosts/new?kind=place">یکی بسازید</a>.</p>';
  }

  function peopleSectionHtml(){
    const assignedIds = tourHosts.people.map(function(a){ return a.hostId; });
    const available = state.hosts.filter(function(h){
      return h.kind === 'person' && assignedIds.indexOf(h.id) === -1;
    });

    const rows = tourHosts.people.map(function(a, i){
      return '<div class="th-row" data-i="' + i + '">' +
          '<div class="th-ord">' +
            '<button type="button" class="th-up" ' + (i === 0 ? 'disabled' : '') + ' title="بالا">↑</button>' +
            '<button type="button" class="th-down" ' + (i === tourHosts.people.length - 1 ? 'disabled' : '') + ' title="پایین">↓</button>' +
          '</div>' +
          '<div class="th-name">' + esc(a.displayName) +
            '<small>/host/' + esc(a.slug) + hiddenWarning(a.status) + '</small></div>' +
          '<select class="th-role">' +
            HOST_PERSON_ROLES.map(function(r){
              return '<option value="' + r + '"' + (a.role === r ? ' selected' : '') + '>' + (r === 'lead' ? 'برگزارکنندهٔ اصلی' : 'همراه') + '</option>';
            }).join('') +
          '</select>' +
          '<button type="button" class="btn small danger th-rm">حذف</button>' +
          '<input type="text" class="th-label" maxlength="40" value="' + esc(a.roleLabel || '') + '" placeholder="عنوان روی کارت (حداکثر ۴۰)، مثلاً موسیقی جز و بلوز" aria-label="عنوان نقش روی کارت ' + esc(a.displayName) + '">' +
        '</div>';
    }).join('');

    return '<h3 style="font-size:14px;margin:0 0 10px;">برگزارکنندگان</h3>' +
      (tourHosts.people.length ? rows : '<p style="color:var(--ink-muted);font-size:13px;">هنوز برگزارکننده‌ای تعیین نشده.</p>') +
      '<div class="th-add">' +
        '<div class="field" style="margin-bottom:0;"><label>افزودن برگزارکننده</label>' +
          '<select id="thPick">' +
            (available.length
              ? '<option value="">انتخاب…</option>' + available.map(function(h){
                  return '<option value="' + h.id + '">' + esc(h.displayName) + ' (' + esc(fa(h.status)) + ')</option>';
                }).join('')
              : '<option value="">برگزارکنندهٔ دیگری نیست</option>') +
          '</select></div>' +
        '<button type="button" class="btn small ghost" id="thAdd"' + (available.length ? '' : ' disabled') + '>+ افزودن</button>' +
      '</div>';
  }

  function drawTourHosts(){
    const panel = document.getElementById('tourHostsPanel');
    if (!panel) return;

    panel.innerHTML =
      venueSectionHtml() +
      peopleSectionHtml() +
      '<div class="th-add" style="margin-top:18px;">' +
        '<button type="button" class="btn small primary" id="thSave">ذخیرهٔ همکاران</button>' +
        '<span class="msg" id="thMsg" style="font-size:13px;color:var(--ink-muted);"></span>' +
      '</div>' +
      '<p style="color:var(--ink-muted);font-size:12px;margin-top:12px;">' +
        'محل و برگزارکنندگان با هم ذخیره می‌شوند. ترتیب اینجا همان ترتیب صفحهٔ تجربه است؛ ' +
        'برگزارکنندهٔ اصلی همیشه قبل از همراهان می‌آید. فقط پروفایل‌های <b>فعال</b> عمومی نمایش داده می‌شوند. ' +
        '<a href="#/hosts">مدیریت پروفایل‌ها ←</a></p>';

    const pick = document.getElementById('tvPick');
    if (pick) pick.addEventListener('change', function(){
      tourHosts.venueId = Number(pick.value) || null;
      drawTourHosts();
    });
    const clearVenue = document.getElementById('tvClear');
    if (clearVenue) clearVenue.addEventListener('click', function(){
      tourHosts.venueId = null;
      drawTourHosts();
    });

    panel.querySelectorAll('.th-rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        tourHosts.people.splice(Number(btn.closest('.th-row').dataset.i), 1);
        drawTourHosts();
      });
    });
    panel.querySelectorAll('.th-up').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.th-row').dataset.i);
        const a = tourHosts.people;
        a.splice(i - 1, 0, a.splice(i, 1)[0]);
        drawTourHosts();
      });
    });
    panel.querySelectorAll('.th-down').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.th-row').dataset.i);
        const a = tourHosts.people;
        a.splice(i + 1, 0, a.splice(i, 1)[0]);
        drawTourHosts();
      });
    });
    panel.querySelectorAll('.th-label').forEach(function(inp){
      inp.addEventListener('input', function(){
        tourHosts.people[Number(inp.closest('.th-row').dataset.i)].roleLabel = inp.value;
      });
    });
    panel.querySelectorAll('.th-role').forEach(function(sel){
      sel.addEventListener('change', function(){
        tourHosts.people[Number(sel.closest('.th-row').dataset.i)].role = sel.value;
      });
    });

    const addBtn = document.getElementById('thAdd');
    if (addBtn) addBtn.addEventListener('click', function(){
      const sel = document.getElementById('thPick');
      const h = hostById(Number(sel.value));
      if (!h) return;
      tourHosts.people.push({
        hostId: h.id, slug: h.slug, displayName: h.displayName, status: h.status, roleLabel: '',
        // First one added is the lead; the rest default to co-host.
        role: tourHosts.people.length === 0 ? 'lead' : 'co_host'
      });
      drawTourHosts();
    });

    document.getElementById('thSave').addEventListener('click', saveTourHosts);
  }

  async function saveTourHosts(){
    const btn = document.getElementById('thSave');
    const msg = document.getElementById('thMsg');
    msg.textContent = '';
    btn.disabled = true;
    const payload = [];
    // The venue goes first so it is also first in the stored sort order —
    // the public tour page renders it above the people.
    if (tourHosts.venueId) payload.push({ hostId: tourHosts.venueId, role: 'venue', sortOrder: 0 });
    tourHosts.people.forEach(function(a, i){
      payload.push({ hostId: a.hostId, role: a.role, roleLabel: (a.roleLabel || '').trim(), sortOrder: payload.length + i });
    });
    try {
      await api('/admin/tours/' + encodeURIComponent(tourHosts.tourId) + '/hosts', {
        method: 'PUT', body: { hosts: payload }
      });
      toast('همکاران ذخیره شدند');
      await initTourHosts(tourHosts.tourId);
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      const field = e.body && e.body.fields ? (e.body.fields.role || e.body.fields.hostId) : null;
      if (e.body && e.body.fields && e.body.fields.roleLabel) msg.textContent = BOOKING_MESSAGES.roleLabel[e.body.fields.roleLabel] || 'عنوان نقش معتبر نیست.';
      else if (field === 'duplicate') msg.textContent = 'یک پروفایل دو بار آمده است.';
      else if (field === 'place_must_be_venue') msg.textContent = 'مکان فقط می‌تواند محل برگزاری باشد، نه همراه.';
      else if (field === 'person_cannot_be_venue') msg.textContent = 'شخص نمی‌تواند محل برگزاری باشد.';
      else if (field === 'multiple_venues') msg.textContent = 'هر تجربه فقط یک محل دارد.';
      else if (e.status === 422) msg.textContent = 'یکی از این پروفایل‌ها دیگر وجود ندارد؛ صفحه را دوباره باز کنید.';
      else msg.textContent = 'ذخیرهٔ همکاران ممکن نشد.';
      btn.disabled = false;
    }
  }

  boot();
})();
</script>
</body>
</html>
