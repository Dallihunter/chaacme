      return '<option value="' + v + '"' + (state.proposalsFilter === v ? ' selected' : '') + '>' + (v || 'All') + '</option>';
    }).join('');
    const cards = list.map(function(p){
      return (
        '<div class="app-card" data-id="' + p.id + '">' +
          '<div class="app-top"><b>' + esc(p.title) + '</b>' +
            (p.host ? '<span class="badge ' + esc(p.host.kind) + '">' + esc(KIND_LABEL[p.host.kind] || p.host.kind) + '</span>' : '') +
            '<span class="badge ' + esc(p.status) + '">' + esc(p.status) + '</span>' +
            '<span class="app-meta">' + esc(String(p.createdAt || '').slice(0, 16).replace('T', ' ')) + '</span></div>' +
          '<div class="app-meta">From: ' + (p.host ? esc(p.host.displayName) : '—') +
            (p.owner ? ' · ' + esc(p.owner.firstName + ' ' + p.owner.lastName) + ' · <span dir="ltr">' + esc(p.owner.phone) + '</span>' : '') + '</div>' +
          '<div class="app-meta">Wants: ' + esc(p.wantedCounterpartKind) + (p.preferredMonths ? ' · Months: ' + esc(p.preferredMonths) : '') + '</div>' +
          '<div class="app-desc">' + esc(p.description) + '</div>' +
          '<div class="app-actions">' +
            '<div class="field"><label>Status</label><select class="prop-status">' +
              PROPOSAL_STATUSES.map(function(v){ return '<option value="' + v + '"' + (p.status === v ? ' selected' : '') + '>' + v + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="field" style="flex:1"><label>Internal note</label><input type="text" class="prop-note" maxlength="2000" value="' + esc(p.adminNote || '') + '"></div>' +
            '<button class="btn small primary prop-save">Save</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    app.innerHTML = shell(
      '<div class="list-head"><h1>پیشنهادهای تجربه</h1></div>' +
      '<div class="filter-row"><label>Status</label><select id="propFilter">' + filterOptions + '</select></div>' +
      (list.length ? cards : '<div class="empty">No proposals.</div>')
    );
    bindLogout();
    document.getElementById('propFilter').addEventListener('change', function(){ state.proposalsFilter = this.value; renderProposals(); });
    app.querySelectorAll('.prop-save').forEach(function(btn){
      btn.addEventListener('click', async function(){
        const card = btn.closest('.app-card');
        btn.disabled = true;
        try {
          await api('/admin/proposals/' + Number(card.dataset.id), { method:'PUT',
            body: { status: card.querySelector('.prop-status').value, adminNote: card.querySelector('.prop-note').value } });
          toast('Saved');
          renderProposals();
        } catch(e){
          if (e.status === 401){ state.admin = null; renderLogin(); return; }
          toast('Save failed', true);
          btn.disabled = false;
        }
      });
    });
  }

  // ---------------------------------------------------------------------
  // Tour ⇄ partners assignment (inside the tour editor)
  // ---------------------------------------------------------------------
  // A tour has one venue (a place) and any number of people (persons). Both
  // live in the same tour_hosts list, so both are edited here and written by
  // a single PUT: the endpoint replaces the whole list in one transaction,
  // and a half-built list must never be sent.
  const tourHosts = { tourId: null, venueId: null, people: [], loaded: false };

  async function initTourHosts(tourId){
    tourHosts.tourId = tourId;
    tourHosts.venueId = null;
    tourHosts.people = [];
    tourHosts.loaded = false;
    try {
      const [assigned] = await Promise.all([
        api('/admin/tours/' + encodeURIComponent(tourId) + '/hosts'),
        state.hosts.length ? Promise.resolve(null) : loadHosts()
      ]);
      assigned.hosts.forEach(function(h){
        if (h.role === 'venue') tourHosts.venueId = h.hostId;
        else tourHosts.people.push({ hostId: h.hostId, slug: h.slug, displayName: h.displayName, status: h.status, role: h.role });
      });
      tourHosts.loaded = true;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      const panel = document.getElementById('tourHostsPanel');
      if (panel) panel.innerHTML = '<h2>Partners</h2><div class="empty">Could not load partner profiles.</div>';
      return;
    }
    drawTourHosts();
  }

  function hostById(id){
    return state.hosts.filter(function(h){ return h.id === id; })[0] || null;
  }

  // A linked profile that is hidden is silently absent from the public page,
  // so say so here rather than let someone assign it and see nothing.
  function hiddenWarning(status){
    return status !== 'active' ? ' — <b>hidden</b>, will not show on the site' : '';
  }

  function venueSectionHtml(){
    const places = state.hosts.filter(function(h){ return h.kind === 'place'; });
    const current = tourHosts.venueId ? hostById(tourHosts.venueId) : null;
    return '<h3 style="font-size:14px;margin:0 0 10px;">محل برگزاری — Venue</h3>' +
      (current
        ? '<div class="th-row">' +
            '<div class="th-name">' + esc(current.displayName) +
              '<small>/host/' + esc(current.slug) +
                (current.region ? ' · ' + esc(current.region) : '') + hiddenWarning(current.status) + '</small></div>' +
            '<button type="button" class="btn small danger" id="tvClear">Remove</button>' +
          '</div>'
        : '') +
      '<div class="th-add">' +
        '<div class="field" style="margin-bottom:0;"><label>' + (current ? 'Replace the venue' : 'Choose the venue') + '</label>' +
          '<select id="tvPick">' +
            (places.length
              ? '<option value="">None</option>' + places.map(function(h){
                  return '<option value="' + h.id + '"' + (h.id === tourHosts.venueId ? ' selected' : '') + '>' +
                    esc(h.displayName) + ' (' + esc(h.status) + ')</option>';
                }).join('')
              : '<option value="">No places yet</option>') +
          '</select></div>' +
      '</div>' +
      '<p style="color:var(--ink-faint);font-size:12px;margin:10px 0 24px;">' +
        'A tour is held in one place. Only profiles of kind <b>place</b> appear here — ' +
        '<a href="#/hosts/new?kind=place">create one</a> if the venue is missing.</p>';
  }

  function peopleSectionHtml(){
    const assignedIds = tourHosts.people.map(function(a){ return a.hostId; });
    const available = state.hosts.filter(function(h){
      return h.kind === 'person' && assignedIds.indexOf(h.id) === -1;
    });

    const rows = tourHosts.people.map(function(a, i){
      return '<div class="th-row" data-i="' + i + '">' +
          '<div class="th-ord">' +
            '<button type="button" class="th-up" ' + (i === 0 ? 'disabled' : '') + ' title="Move up">↑</button>' +
            '<button type="button" class="th-down" ' + (i === tourHosts.people.length - 1 ? 'disabled' : '') + ' title="Move down">↓</button>' +
          '</div>' +
          '<div class="th-name">' + esc(a.displayName) +
            '<small>/host/' + esc(a.slug) + hiddenWarning(a.status) + '</small></div>' +
          '<select class="th-role">' +
            HOST_PERSON_ROLES.map(function(r){
              return '<option value="' + r + '"' + (a.role === r ? ' selected' : '') + '>' + (r === 'lead' ? 'Lead' : 'Co-host') + '</option>';
            }).join('') +
          '</select>' +
          '<button type="button" class="btn small danger th-rm">Remove</button>' +
        '</div>';
    }).join('');

    return '<h3 style="font-size:14px;margin:0 0 10px;">برگزارکنندگان — People</h3>' +
      (tourHosts.people.length ? rows : '<p style="color:var(--ink-faint);font-size:13px;">No people assigned.</p>') +
      '<div class="th-add">' +
        '<div class="field" style="margin-bottom:0;"><label>Add a person</label>' +
          '<select id="thPick">' +
            (available.length
              ? '<option value="">Choose…</option>' + available.map(function(h){
                  return '<option value="' + h.id + '">' + esc(h.displayName) + ' (' + esc(h.status) + ')</option>';
                }).join('')
              : '<option value="">No other people available</option>') +
          '</select></div>' +
        '<button type="button" class="btn small ghost" id="thAdd"' + (available.length ? '' : ' disabled') + '>+ Add</button>' +
      '</div>';
  }

  function drawTourHosts(){
    const panel = document.getElementById('tourHostsPanel');
    if (!panel) return;

    panel.innerHTML =
      '<h2>Partners</h2>' +
      venueSectionHtml() +
      peopleSectionHtml() +
      '<div class="th-add" style="margin-top:18px;">' +
        '<button type="button" class="btn small primary" id="thSave">Save partners</button>' +
        '<span class="msg" id="thMsg" style="font-size:13px;color:var(--ink-faint);"></span>' +
      '</div>' +
      '<p style="color:var(--ink-faint);font-size:12px;margin-top:12px;">' +
        'The venue and the people are saved together, in one step. Order here is the order on the tour page; ' +
        'leads are always shown before co-hosts. Only <b>active</b> profiles appear publicly. ' +
        '<a href="#/hosts">Manage profiles →</a></p>';

    const pick = document.getElementById('tvPick');
    if (pick) pick.addEventListener('change', function(){
      tourHosts.venueId = Number(pick.value) || null;
      drawTourHosts();
    });
    const clearVenue = document.getElementById('tvClear');
    if (clearVenue) clearVenue.addEventListener('click', function(){
      tourHosts.venueId = null;
      drawTourHosts();
    });

    panel.querySelectorAll('.th-rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        tourHosts.people.splice(Number(btn.closest('.th-row').dataset.i), 1);
        drawTourHosts();
      });
    });
    panel.querySelectorAll('.th-up').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.th-row').dataset.i);
        const a = tourHosts.people;
        a.splice(i - 1, 0, a.splice(i, 1)[0]);
        drawTourHosts();
      });
    });
    panel.querySelectorAll('.th-down').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.th-row').dataset.i);
        const a = tourHosts.people;
        a.splice(i + 1, 0, a.splice(i, 1)[0]);
        drawTourHosts();
      });
    });
    panel.querySelectorAll('.th-role').forEach(function(sel){
      sel.addEventListener('change', function(){
        tourHosts.people[Number(sel.closest('.th-row').dataset.i)].role = sel.value;
      });
    });

    const addBtn = document.getElementById('thAdd');
    if (addBtn) addBtn.addEventListener('click', function(){
      const sel = document.getElementById('thPick');
      const h = hostById(Number(sel.value));
      if (!h) return;
      tourHosts.people.push({
        hostId: h.id, slug: h.slug, displayName: h.displayName, status: h.status,
        // First one added is the lead; the rest default to co-host.
        role: tourHosts.people.length === 0 ? 'lead' : 'co_host'
      });
      drawTourHosts();
    });

    document.getElementById('thSave').addEventListener('click', saveTourHosts);
  }

  async function saveTourHosts(){
    const btn = document.getElementById('thSave');
    const msg = document.getElementById('thMsg');
    msg.textContent = '';
    btn.disabled = true;
    const payload = [];
    // The venue goes first so it is also first in the stored sort order —
    // the public tour page renders it above the people.
    if (tourHosts.venueId) payload.push({ hostId: tourHosts.venueId, role: 'venue', sortOrder: 0 });
    tourHosts.people.forEach(function(a, i){
      payload.push({ hostId: a.hostId, role: a.role, sortOrder: payload.length + i });
    });
    try {
      await api('/admin/tours/' + encodeURIComponent(tourHosts.tourId) + '/hosts', {
        method: 'PUT', body: { hosts: payload }
      });
      toast('Partners saved');
      await initTourHosts(tourHosts.tourId);
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      const field = e.body && e.body.fields ? (e.body.fields.role || e.body.fields.hostId) : null;
      if (field === 'duplicate') msg.textContent = 'The same profile is listed twice.';
      else if (field === 'place_must_be_venue') msg.textContent = 'A place can only be the venue, not a co-host.';
      else if (field === 'person_cannot_be_venue') msg.textContent = 'A person cannot be the venue.';
      else if (field === 'multiple_venues') msg.textContent = 'A tour can only have one venue.';
      else if (e.status === 422) msg.textContent = 'One of these profiles no longer exists — reload the page.';
      else msg.textContent = 'Could not save partners.';
      btn.disabled = false;
    }
  }

  boot();
})();
</script>
</body>
</html>
