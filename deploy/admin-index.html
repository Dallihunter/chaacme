<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAACME — ادمین</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="/assets/fonts/vazirmatn-5.3.0-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/chaacme.css">
</head>
<body class="ad-body">
<div class="ck-root ad" dir="rtl">
<div id="toast"></div>

<div id="app"></div>
</div>

<script type="module">
import { header } from '/assets/js/shared/components/header.js';
import { html, toHtmlString } from '/assets/js/shared/html.js';
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // API client
  // ---------------------------------------------------------------------
  async function api(path, opts){
    opts = opts || {};
    const headers = Object.assign({}, opts.headers || {});
    let body = opts.body;
    if (body !== undefined && !(body instanceof FormData)){
      headers['content-type'] = 'application/json';
      body = JSON.stringify(body);
    }
    const res = await fetch('/api' + path, {
      method: opts.method || 'GET',
      headers,
      body,
      credentials: 'same-origin'
    });
    let data = null;
    try { data = await res.json(); } catch(e){ /* no body */ }
    if (!res.ok){
      const err = new Error((data && data.error) || ('http_' + res.status));
      err.status = res.status; err.body = data;
      throw err;
    }
    return data;
  }

  function toast(msg, isErr){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.className = ''; }, 3200);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  const STATUSES = ['draft', 'published', 'coming_soon', 'archived'];
  // Mirrors isValidHostSlug() on the server. The slug is the public URL of a
  // profile (/host/<slug>) and is immutable once created, so it is validated
  // here before the request rather than after a 422.
  const HOST_SLUG_RE = /^[a-z0-9-]{2,40}$/;
  const HOST_STATUSES = ['hidden', 'active'];
  // 'venue' is a place's only role and the only role a place may have; the
  // two people roles are the only ones a person may have. The server
  // enforces this too — these lists just stop the UI offering a 422.
  const HOST_PERSON_ROLES = ['lead', 'co_host'];
  const HOST_KINDS = ['person', 'place'];
  const KIND_LABEL = { person: 'شخص', place: 'مکان' };
  const TOUR_ID_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
  const PAYMENT_STATUSES = ['pending', 'paid', 'failed', 'canceled', 'paid_no_capacity'];
  // what the admin reads for every status value (the values themselves are what the API stores)
  const STATUS_FA = { draft: 'پیش‌نویس', published: 'منتشرشده', coming_soon: 'به‌زودی', archived: 'بایگانی', hidden: 'پنهان', active: 'فعال',
    pending: 'در انتظار', approved: 'پذیرفته‌شده', rejected: 'ردشده', paid: 'پرداخت‌شده', failed: 'ناموفق', canceled: 'لغوشده',
    paid_no_capacity: 'پرداخت‌شده بدون ظرفیت', new: 'جدید', in_discussion: 'در حال گفتگو', accepted: 'پذیرفته‌شد', declined: 'ممکن نشد' };
  const fa = function(v){ return Object.prototype.hasOwnProperty.call(STATUS_FA, v) ? STATUS_FA[v] : String(v).replace(/_/g, ' '); };

  // ---------------------------------------------------------------------
  // App state + tiny hash router
  // ---------------------------------------------------------------------
  const state = { admin: null, onlineBooking: null, tours: [], bookings: [], bookingsFilter: '', busy: false,
                  hosts: [], applications: [], applicationsFilter: '', hostsFilter: '',
                  revisionsFilter: 'pending', proposalsFilter: '' };
  const app = document.getElementById('app');

  function route(){
    const hash = location.hash.replace(/^#\/?/, '');
    if (!state.admin){ renderLogin(); return; }
    if (hash === '' || hash === 'tours') { renderList(); return; }
    if (hash === 'tours/new') { renderEditor(null); return; }
    if (hash === 'bookings') { renderBookings(); return; }
    if (hash === 'hosts') { renderHosts(); return; }
    if (hash === 'hosts/new') { renderHostEditor(null, 'person'); return; }
    if (hash === 'hosts/new?kind=place') { renderHostEditor(null, 'place'); return; }
    if (hash === 'applications') { renderApplications(); return; }
    if (hash === 'revisions') { renderRevisions(); return; }
    if (hash === 'proposals') { renderProposals(); return; }
    if (hash === 'settings') { renderSettings(); return; }
    const mh = /^hosts\/(\d+)\/edit$/.exec(hash);
    if (mh) { renderHostEditor(Number(mh[1])); return; }
    const m = /^tours\/([^/]+)\/edit$/.exec(hash);
    if (m) { renderEditor(m[1]); return; }
    renderList();
  }
  window.addEventListener('hashchange', route);

  async function boot(){
    try {
      const me = await api('/admin/me');
      state.admin = me.admin;
      state.onlineBooking = me.onlineBooking === undefined ? null : !!me.onlineBooking;
    } catch(e){ state.admin = null; }
    route();
  }

  // ---------------------------------------------------------------------
  // Shell (topbar) — wraps every authenticated view
  // ---------------------------------------------------------------------
  const SECTIONS = [
    ['tours', 'تجربه‌ها', '#/tours'], ['hosts', 'همکاران', '#/hosts'], ['applications', 'درخواست‌ها', '#/applications'],
    ['revisions', 'بازبینی تغییرات', '#/revisions'], ['proposals', 'پیشنهادها', '#/proposals'], ['bookings', 'رزروها', '#/bookings'],
    ['settings', 'صفحهٔ اول', '#/settings']
  ];
  function activeSection(){
    const h = location.hash.replace(/^#\/?/, '').split(/[/?]/)[0];
    return SECTIONS.some(function(x){ return x[0] === h; }) ? h : 'tours';
  }

  function shell(contentHtml){
    // the same header component as the site, in its admin variant
    // Absolute /admin/#/... paths, not bare #/... fragments: the CDN can keep serving an older shared html.js (these modules are
    // imported without a ?v=), and its safeUrl turns a bare fragment into "#", which made every link dead. A site path passes both.
    const links = SECTIONS.map(function(x){ return { key: x[0], label: x[1], href: '/admin/' + x[2] }; });
    const bar = toHtmlString(header({
      variant: 'admin', label: 'ادمین', authSlot: false, wide: true, links: links, active: activeSection(),
      extra: html`<span class="ck-site-label">${state.admin ? state.admin.username : ''}</span><a href="#/tours" data-logout>خروج</a>`
    }));
    return bar + '<main><div class="wrap">' + contentHtml + '</div></main>';
  }

  function bindLogout(){
    document.querySelectorAll('[data-logout]').forEach(function(el){
      el.addEventListener('click', async function(){
        try { await api('/admin/logout', { method:'POST' }); } catch(e){}
        state.admin = null;
        location.hash = '';
        route();
      });
    });
  }

  // ---------------------------------------------------------------------
  // Site settings: the home page, the become-host band, the footer, the info pages
  // ---------------------------------------------------------------------
  const MEDIA_LABEL = { image: 'تصویر', video: 'ویدیو' };

  async function renderSettings(){
    app.innerHTML = shell('<div class="empty">در حال بارگذاری…</div>');
    bindLogout();
    let data;
    try { data = await api('/admin/settings'); }
    catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('بارگذاری تنظیمات ممکن نشد', true);
      return;
    }
    const st = Object.assign({}, data.settings);          // working copy; written by "ذخیره"
    const F = data.fields;
    const maxMb = Math.round((data.maxVideoBytes || 0) / 1048576);
    let links = [];
    try { links = JSON.parse(st.footer_links || '[]'); } catch(e){ links = []; }
    const where = function(t){ return '<span class="where">روی صفحه: ' + t + '</span>'; };

    function txt(key, label, hint, area){
      const v = st[key] == null ? '' : st[key];
      const max = F[key] && F[key].max ? ' maxlength="' + F[key].max + '"' : '';
      return '<div class="field"><label for="s_' + key + '">' + esc(label) + (F[key] && F[key].max ? ' <span class="muted">(حداکثر ' + F[key].max + ')</span>' : '') + '</label>' +
        (area ? '<textarea id="s_' + key + '" data-key="' + key + '"' + max + ' rows="' + (area === true ? 3 : area) + '">' + esc(v) + '</textarea>'
              : '<input type="text" id="s_' + key + '" data-key="' + key + '"' + max + ' value="' + esc(v) + '">') +
        (hint ? '<p class="hint">' + esc(hint) + '</p>' : '') + '</div>';
    }
    function mediaBox(key, label, kind, hint){
      return '<div class="field" data-media-field="' + key + '"><label>' + esc(label) + '</label><div class="st-media" data-media="' + key + '" data-kind="' + kind + '"></div>' +
        (hint ? '<p class="hint">' + esc(hint) + '</p>' : '') + '</div>';
    }
    function card(n){
      return '<div class="st-card"><b>کارت ' + n + '</b>' +
        txt('explainer_' + n + '_title', 'عنوان', '') + txt('explainer_' + n + '_text', 'توضیح کوتاه', '') +
        mediaBox('explainer_' + n + '_image', 'تصویر', 'image', '') + '</div>';
    }

    app.innerHTML = shell(
      '<div class="list-head"><div><h1>صفحهٔ اول و تنظیمات</h1><p class="muted">هر بخشی که خالی بماند، روی سایت نمایش داده نمی‌شود.</p></div></div>' +

      '<section class="panel"><h2>بالای صفحهٔ اول ' + where('تصویر یا ویدیوی بزرگ بالای /') + '</h2>' +
        mediaBox('home_hero_video', 'ویدیو', 'video', 'فقط mp4، حداکثر ' + maxMb + ' مگابایت. بدون پردازش ذخیره می‌شود؛ پیش از بارگذاری آن را فشرده کنید.') +
        '<div class="grid2">' + mediaBox('home_hero_poster', 'پوستر ویدیو', 'image', 'تا ویدیو بارگذاری می‌شود دیده می‌شود.') +
        mediaBox('home_hero_image', 'تصویر جایگزین', 'image', 'اگر ویدیو نباشد، این تصویر نمایش داده می‌شود.') + '</div>' +
        txt('home_hero_headline', 'تیتر', '') + txt('home_hero_subline', 'زیرتیتر', '', true) +
        '<div class="grid2">' + txt('home_cta_primary', 'دکمهٔ اول (به فهرست تجربه‌ها)', '') + txt('home_cta_secondary', 'دکمهٔ دوم (به صفحهٔ همکاری با چکمه)', '') + '</div>' +
      '</section>' +

      '<section class="panel" id="st_how"><h2>بخش توضیح ' + where('«هر تجربه سه تکه دارد» در صفحهٔ اول') + '</h2>' +
        txt('explainer_title', 'عنوان', '') + txt('explainer_text', 'متن', '', true) +
        '<div class="st-cards">' + card(1) + card(2) + card(3) + '</div>' +
      '</section>' +

      '<section class="panel"><h2>دعوت به همکاری ' + where('نوار پایین صفحهٔ اول') + '</h2>' +
        txt('become_host_title', 'عنوان', '') + txt('become_host_text', 'متن', '', true) + txt('become_host_cta', 'برچسب دکمه (به /become-host)', '') +
      '</section>' +

      '<section class="panel"><h2>پایین صفحه ' + where('فوتر همهٔ صفحه‌ها') + '</h2>' +
        txt('instagram_handle', 'اینستاگرام', 'فقط نام کاربری، بدون @ و لینک. خالی = پیوند اینستاگرام نمایش داده نمی‌شود.') +
        '<div class="field st-links"><label>پیوندهای بیشتر <span class="muted">(حداکثر ۸؛ مسیرهای داخلی فقط از صفحه‌های موجود یا آدرس https)</span></label><div id="stLinks"></div>' +
        '<button type="button" class="btn small ghost" id="stAddLink">+ پیوند</button>' +
        '<datalist id="stPaths">' + (data.footerPaths || []).map(function(x){ return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
        '<p class="hint">پیوند به «درباره، تماس، قوانین، استرداد، حریم خصوصی» به‌صورت خودکار و فقط وقتی متن آن نوشته شده باشد در فوتر می‌آید.</p></div>' +
      '</section>' +

      '<section class="panel"><h2>تماس با ما ' + where('/contact و فوتر') + '</h2>' +
        '<p class="hint" style="margin-bottom:14px">هر فیلدی که پر شود در صفحهٔ «تماس با ما» می‌آید؛ تلفن و ایمیل لینک تماس می‌شوند. اگر همه خالی باشند صفحه منتشر نمی‌شود (۴۰۴) و لینک آن در فوتر نمی‌آید.</p>' +
        '<div class="grid2">' + txt('contact_phone', 'تلفن', 'مثلاً ۰۲۱۱۲۳۴۵۶۷۸ یا +98 21 12345678') + txt('contact_email', 'ایمیل', '') + '</div>' +
        txt('contact_address', 'نشانی', '', 3) + txt('contact_hours', 'ساعت کاری', 'هر خط یک مورد، مثلاً «شنبه تا چهارشنبه، ۹ تا ۱۷».', 3) +
      '</section>' +

      '<section class="panel"><h2>صفحه‌های متنی ' + where('/about، /terms، /refund، /privacy') + '</h2>' +
        '<p class="hint" style="margin-bottom:14px">متن ساده با پاراگراف (یک خط خالی بین پاراگراف‌ها). HTML پذیرفته نمی‌شود. صفحهٔ خالی منتشر نمی‌شود (۴۰۴) و لینک آن در فوتر نمی‌آید.</p>' +
        txt('page_about', 'درباره چکمه (/about)', '', 8) + txt('page_terms', 'قوانین و مقررات (/terms)', '', 8) +
        txt('page_refund', 'شرایط استرداد (/refund)', '', 8) + txt('page_privacy', 'حریم خصوصی (/privacy)', '', 8) +
      '</section>' +

      '<div class="save-bar"><span class="msg" id="stMsg"></span><button class="btn primary" id="stSave">ذخیره</button></div>'
    );
    bindLogout();

    // ---- media fields
    function paintMedia(key){
      const box = app.querySelector('[data-media="' + key + '"]');
      const kind = box.dataset.kind;
      const v = st[key];
      const preview = v
        ? (kind === 'video' ? '<video src="' + esc(v) + '" muted controls preload="metadata"></video>' : '<img src="' + esc(v) + '" alt="">')
        : '';
      box.innerHTML = preview +
        '<input type="file" accept="' + (kind === 'video' ? 'video/mp4' : 'image/png,image/jpeg,image/webp') + '" aria-label="' + esc(MEDIA_LABEL[kind]) + '">' +
        '<button type="button" class="btn small primary" data-up>بارگذاری</button>' +
        (v ? '<button type="button" class="btn small danger" data-rm>حذف</button>' : '');
      box.querySelector('[data-up]').addEventListener('click', async function(){
        const f = box.querySelector('input[type=file]').files[0];
        if (!f){ toast('ابتدا یک فایل انتخاب کنید', true); return; }
        const fd = new FormData();
        fd.append('file', f);
        this.disabled = true;
        try {
          if (kind === 'video') {
            if (f.size > data.maxVideoBytes){ toast('حجم ویدیو بیش از ' + maxMb + ' مگابایت است', true); return; }
            st[key] = (await api('/admin/upload-video', { method: 'POST', body: fd })).path;
          } else {
            fd.append('site', '1');
            st[key] = (await api('/admin/upload', { method: 'POST', body: fd })).path;
          }
          paintMedia(key);
          toast('بارگذاری شد؛ فراموش نکنید ذخیره کنید');
        } catch(e){
          toast(e.status === 413 ? 'فایل بزرگ‌تر از حد مجاز است' : (e.status === 422 ? 'این فایل پذیرفته نشد' : 'بارگذاری ممکن نشد'), true);
          this.disabled = false;
        }
      });
      const rm = box.querySelector('[data-rm]');
      if (rm) rm.addEventListener('click', function(){ st[key] = null; paintMedia(key); });
    }
    app.querySelectorAll('[data-media]').forEach(function(b){ paintMedia(b.dataset.media); });

    // ---- footer links
    function paintLinks(){
      const box = document.getElementById('stLinks');
      box.innerHTML = links.map(function(l, i){
        return '<div class="th-row" data-i="' + i + '">' +
          '<input type="text" data-l="label" maxlength="30" aria-label="برچسب" placeholder="برچسب" value="' + esc(l.label) + '">' +
          '<input type="text" data-l="href" list="stPaths" dir="ltr" aria-label="آدرس" placeholder="/experiences یا https://…" value="' + esc(l.href) + '">' +
          '<button type="button" class="btn small danger" data-lrm>×</button></div>';
      }).join('');
      box.querySelectorAll('[data-l]').forEach(function(inp){
        inp.addEventListener('input', function(){ links[Number(inp.closest('.th-row').dataset.i)][inp.dataset.l] = inp.value; });
      });
      box.querySelectorAll('[data-lrm]').forEach(function(b){
        b.addEventListener('click', function(){ links.splice(Number(b.closest('.th-row').dataset.i), 1); paintLinks(); });
      });
    }
    paintLinks();
    document.getElementById('stAddLink').addEventListener('click', function(){
      if (links.length >= 8){ toast('حداکثر ۸ پیوند', true); return; }
      links.push({ label: '', href: '' });
      paintLinks();
    });

    // ---- save: every key is sent; an empty value removes it
    document.getElementById('stSave').addEventListener('click', async function(){
      const btn = this; const msg = document.getElementById('stMsg');
      msg.textContent = '';
      const values = {};
      Object.keys(F).forEach(function(key){
        if (F[key].kind === 'links') { values[key] = links.filter(function(l){ return l.label.trim() || l.href.trim(); }); return; }
        if (F[key].kind === 'image' || F[key].kind === 'video') { values[key] = st[key] || ''; return; }
        const el = app.querySelector('[data-key="' + key + '"]');
        values[key] = el ? el.value : '';
      });
      btn.disabled = true;
      try {
        const out = await api('/admin/settings', { method: 'PUT', body: { values: values } });
        Object.assign(st, out.settings);
        toast('ذخیره شد');
        msg.textContent = 'ذخیره شد. صفحه‌های عمومی تا حدود یک دقیقه ممکن است نسخهٔ قبلی را نشان دهند.';
      } catch(e){
        if (e.status === 401){ state.admin = null; renderLogin(); return; }
        const f = e.body && e.body.fields ? Object.keys(e.body.fields) : [];
        msg.textContent = e.status === 422 ? 'این موارد پذیرفته نشد: ' + f.join('، ') : 'ذخیره ممکن نشد.';
      } finally { btn.disabled = false; }
    });
  }

  // ---------------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------------
  function renderLogin(){
    app.innerHTML =
      '<div class="login-wrap">' +
        '<h1>ورود ادمین</h1>' +
        '<p class="sub">مدیریت چکمه</p>' +
        '<div id="loginError" class="error" hidden></div>' +
        '<form id="loginForm">' +
          '<div class="field"><label>نام کاربری</label><input type="text" id="loginUsername" autocomplete="username" required></div>' +
          '<div class="field"><label>رمز عبور</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>' +
          '<button class="btn primary" type="submit" style="width:100%" id="loginSubmit">ورود</button>' +
        '</form>' +
      '</div>';

    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.hidden = true;
      const btn = document.getElementById('loginSubmit');
      btn.disabled = true;
      try {
        await api('/admin/login', {
          method: 'POST',
          body: {
            username: document.getElementById('loginUsername').value.trim(),
            password: document.getElementById('loginPassword').value
          }
        });
        const me = await api('/admin/me');
        state.admin = me.admin;
        state.onlineBooking = me.onlineBooking === undefined ? null : !!me.onlineBooking;
        location.hash = '#/tours';
        route();
      } catch(err){
        errEl.textContent = err.status === 429
          ? 'تعداد تلاش‌ها زیاد است. چند دقیقه صبر کنید.'
          : 'نام کاربری یا رمز عبور اشتباه است.';
        errEl.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  }

  // ---------------------------------------------------------------------
  // Tour list
  // ---------------------------------------------------------------------
  async function renderList(){
    app.innerHTML = shell('<div class="empty">در حال بارگذاری…</div>');
    bindLogout();
    try {
      const data = await api('/admin/tours');
      state.tours = data.tours;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('بارگذاری تجربه‌ها ممکن نشد', true);
      state.tours = [];
    }

    const rows = state.tours.map(function(t){
      const status = t.status || 'draft';
      return (
        '<tr>' +
          '<td>' + esc(t.name) + '<div style="color:var(--ink-muted);font-size:12px;">' + esc(t.id) + '</div></td>' +
          '<td><span class="badge ' + esc(status) + '">' + esc(fa(status)) + '</span></td>' +
          '<td>' + (t.featured ? '★' : '') + '</td>' +
          '<td>' + (t.price != null ? Number(t.price).toLocaleString('en-US') : '—') + '</td>' +
          '<td><div class="row-actions">' +
            '<a class="btn small ghost" href="#/tours/' + encodeURIComponent(t.id) + '/edit">ویرایش</a>' +
          '</div></td>' +
        '</tr>'
      );
    }).join('');

    app.innerHTML = shell(
      '<div class="list-head"><h1>تجربه‌ها</h1><a class="btn primary" href="#/tours/new">+ تجربهٔ جدید</a></div>' +
      (state.tours.length
        ? '<table class="tours"><thead><tr><th>نام</th><th>وضعیت</th><th>ویژه</th><th>قیمت</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty">هنوز تجربه‌ای نیست. اولی را بسازید.</div>')
    );
    bindLogout();
  }

  // ---------------------------------------------------------------------
  // Bookings + payments
  // ---------------------------------------------------------------------
  async function renderBookings(){
    app.innerHTML = shell('<div class="empty">در حال بارگذاری…</div>');
    bindLogout();
    try {
      const qs = state.bookingsFilter ? ('?payment_status=' + encodeURIComponent(state.bookingsFilter)) : '';
      const data = await api('/admin/bookings' + qs);
      state.bookings = data.bookings;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('بارگذاری رزروها ممکن نشد', true);
      state.bookings = [];
    }
    paintBookings();
  }

  function paintBookings(){
    const filterOptions = ['<option value="">همهٔ وضعیت‌های پرداخت</option>'].concat(
      PAYMENT_STATUSES.map(function(s){
        return '<option value="' + esc(s) + '"' + (s === state.bookingsFilter ? ' selected' : '') + '>' + esc(fa(s)) + '</option>';
      })
    ).join('');

    const rows = state.bookings.map(function(b){
      const status = b.paymentStatus || 'pending';
      const flagged = status === 'paid_no_capacity';
      const customer = [b.firstName, b.lastName].filter(Boolean).join(' ') || '—';
      return (
        '<tr' + (flagged ? ' class="needs-attention"' : '') + '>' +
          '<td>' + esc(b.ref) + '</td>' +
          '<td>' + esc(b.tourTitle) + '<div style="color:var(--ink-muted);font-size:12px;">' + esc(b.dateLabel) + (b.startsOn ? ' · ' + esc(b.startsOn) : '') + '</div></td>' +
          '<td>' + esc(b.guests) + '</td>' +
          '<td>' + esc(customer) + '<div style="color:var(--ink-muted);font-size:12px;">' + esc(b.phone) + '</div></td>' +
          '<td><span class="badge ' + esc(status) + '">' + (flagged ? '⚠ ' : '') + esc(fa(status)) + '</span></td>' +
          '<td>' + Number(b.total || 0).toLocaleString('en-US') + '</td>' +
          '<td style="font-size:12px;color:var(--ink-muted);">' + esc(b.zarinpalRefId || '—') + '</td>' +
          '<td style="font-size:12px;color:var(--ink-muted);">' + esc(b.createdAt) + '</td>' +
        '</tr>'
      );
    }).join('');

    app.innerHTML = shell(
      '<div class="list-head"><h1>رزروها و پرداخت‌ها</h1></div>' +
      '<div class="filter-row"><label>وضعیت پرداخت</label><select id="bookingsFilter">' + filterOptions + '</select></div>' +
      (state.bookings.length
        ? '<table class="tours"><thead><tr><th>کد رزرو</th><th>تجربه / تاریخ</th><th>نفرات</th><th>مشتری</th><th>پرداخت</th><th>مبلغ (تومان)</th><th>کد زرین‌پال</th><th>ثبت</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty">رزروی با این فیلتر نیست.</div>')
    );
    bindLogout();

    document.getElementById('bookingsFilter').addEventListener('change', function(){
      state.bookingsFilter = this.value;
      renderBookings();
    });
  }

  async function renderEditor(id){
    const isNew = !id;
    app.innerHTML = shell('<div class="empty">در حال بارگذاری…</div>');
    bindLogout();

    let tour;
    if (isNew){
      tour = emptyTour();
    } else {
      try {
        const data = await api('/admin/tours/' + encodeURIComponent(id));
        tour = data.tour;
        if (!Array.isArray(tour.galleryMedia)) tour.galleryMedia = [];
        (tour.itinerary || []).forEach(function(it){
          if (!Array.isArray(it.photos)) it.photos = [];
          if (!Array.isArray(it.images)) it.images = [];
          // Older rows keep their photos in photoPath/photos; fold them into images (which carry alt + caption).
          if (!it.images.length && (it.photoPath || it.photos.length)){
            it.images = [it.photoPath].concat(it.photos).filter(Boolean).map(function(path){ return { path: path, alt: '', caption: '' }; }).slice(0, MAX_ITIN_IMAGES);
            it.photoPath = ''; it.photos = [];
          }
        });
      } catch(e){
        if (e.status === 401){ state.admin = null; renderLogin(); return; }
        toast('بارگذاری تجربه ممکن نشد', true);
        location.hash = '#/tours';
        return;
      }
    }

    const ed = { tour: tour, isNew: isNew };
    paintEditor(ed);
  }

  // ---------------------------------------------------------------------
  // Reservation: how the tour is booked (section 5)
  // ---------------------------------------------------------------------
  // The checks below mirror deploy/assets/js/shared/booking.js (this page is a plain script and does not import it);
  // the server checks again and is the judge. test/booking-mode.test.js runs both over the same inputs.
  const BOOKING_MODES = [
    ['online', 'آنلاین (پرداخت در خود سایت)'],
    ['external', 'رزرو بیرونی (دکمه‌ای که به لینک، تماس یا ایمیل می‌رود)'],
    ['none', 'بدون رزرو (فقط تاریخ و توضیح)']
  ];
  const BOOKING_UNSAFE = /[\s\u0000-\u001f\u007f-\u009f"'<>`\\\u2028\u2029]/;
  const BOOKING_TEL = /^tel:\+?[0-9()\-.]{3,30}$/i;
  const BOOKING_MAILTO = /^mailto:[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?:\?[A-Za-z0-9._~%!$&()*+,;=:@/?-]*)?$/i;
  // '' when the link is fine (or empty), else 'length' | 'format' | 'scheme'
  function bookingUrlProblem(raw){
    const s = String(raw == null ? '' : raw).trim();
    if (!s) return '';
    if (s.length > 300) return 'length';
    if (BOOKING_UNSAFE.test(s)) return 'format';
    const sc = /^([a-z][a-z0-9+.-]*):/i.exec(s);
    const name = sc ? sc[1].toLowerCase() : '';
    if (name === 'tel') return BOOKING_TEL.test(s) && /\d.*\d.*\d/.test(s) ? '' : 'format';
    if (name === 'mailto') return BOOKING_MAILTO.test(s) ? '' : 'format';
    if (name !== 'https') return 'scheme';
    if (!/^https:\/\/[^/?#]/i.test(s)) return 'format';
    try { const u = new URL(s); return (u.protocol === 'https:' && u.hostname && !u.username && !u.password) ? '' : 'format'; }
    catch(e){ return 'format'; }
  }
  const BOOKING_MESSAGES = {
    bookingMode: { value: 'حالت رزرو معتبر نیست.' },
    bookingUrl: {
      required: 'برای رزرو بیرونی، لینک رزرو لازم است.',
      scheme: 'لینک رزرو فقط می‌تواند با https://‎ ، tel: یا mailto: شروع شود (http:// و بقیه پذیرفته نیست).',
      format: 'لینک رزرو معتبر نیست. بدون فاصله و علامت اضافه، مثلاً https://example.com/book یا tel:+989121234567 یا mailto:info@example.com',
      length: 'لینک رزرو حداکثر ۳۰۰ نویسه است.',
      type: 'لینک رزرو معتبر نیست.'
    },
    bookingLabel: { length: 'متن دکمه حداکثر ۴۰ نویسه است.', format: 'متن دکمه نویسهٔ غیرمجاز دارد.', type: 'متن دکمه معتبر نیست.' },
    bookingNote: { length: 'یادداشت حداکثر ۲۰۰ نویسه است.', format: 'یادداشت نویسهٔ غیرمجاز دارد.', type: 'یادداشت معتبر نیست.' },
    roleLabel: { length: 'عنوان نقش حداکثر ۴۰ نویسه است.', format: 'عنوان نقش نویسهٔ غیرمجاز دارد.', type: 'عنوان نقش معتبر نیست.' }
  };
  // First Persian message for the booking fields in a server 422 body ({ fields: { bookingUrl: 'scheme', ... } }), or ''.
  function bookingFieldMessage(fields){
    const keys = Object.keys(BOOKING_MESSAGES);
    for (let i = 0; i < keys.length; i++){
      const code = fields && fields[keys[i]];
      if (code) return BOOKING_MESSAGES[keys[i]][code] || ('این فیلد را بررسی کنید: ' + keys[i]);
    }
    return '';
  }

  function bookingBlockHtml(t){
    const mode = t.bookingMode || 'online';
    return '<h3 class="where" style="margin:0 0 10px">رزرو <span class="muted">(روی کارت رزرو و نوار پایین موبایل)</span></h3>' +
      '<div class="field"><label>نوع رزرو</label><select id="f_bookingMode">' +
        BOOKING_MODES.map(function(m){ return '<option value="' + m[0] + '"' + (m[0] === mode ? ' selected' : '') + '>' + esc(m[1]) + '</option>'; }).join('') +
      '</select></div>' +
      '<p class="muted" id="bookingModeHint" style="margin:-8px 0 14px"></p>' +
      '<div id="bookingExtBox">' +
        '<div class="grid2">' +
          '<div class="field"><label>لینک رزرو <span class="muted">(فقط https:// ، tel: یا mailto: ؛ حداکثر ۳۰۰)</span></label>' +
            '<input type="text" id="f_bookingUrl" dir="ltr" maxlength="300" value="' + esc(t.bookingUrl || '') + '" placeholder="https://example.com/book  یا  tel:+989121234567"></div>' +
          limitedField('متن دکمه (خالی = «رزرو»)', 'f_bookingLabel', t.bookingLabel, 40) +
        '</div>' +
      '</div>' +
      limitedField('یادداشت کنار تاریخ‌ها (متن ساده)', 'f_bookingNote', t.bookingNote, 200) +
      '<p class="msg" id="bookingMsg" style="color:var(--danger);font-size:13px;min-height:0" role="alert"></p>';
  }

  function paintBookingHint(){
    const sel = document.getElementById('f_bookingMode');
    if (!sel) return;
    const mode = sel.value;
    const box = document.getElementById('bookingExtBox');
    if (box) box.hidden = mode !== 'external';
    const hint = document.getElementById('bookingModeHint');
    if (!hint) return;
    hint.textContent = mode === 'external'
      ? 'تاریخ‌ها فقط برای اطلاع نشان داده می‌شوند (بدون تعداد جای خالی و ظرفیت)، همراه یک دکمه که به لینک بالا می‌رود.'
      : mode === 'none'
        ? 'فقط تاریخ‌ها و یادداشت نشان داده می‌شود؛ هیچ دکمه‌ای نیست.'
        : (state.onlineBooking === false
          ? 'رزرو آنلاین در کل سایت فعلاً خاموش است: این تجربه مثل «بدون رزرو» نشان داده می‌شود و زیرش نوشته می‌شود «رزرو آنلاین به‌زودی فعال می‌شود».'
          : 'فرم رزرو و پرداخت خود سایت (ظرفیت و جای خالی از همین پنل).');
  }

  // '' when the booking fields are fine, else a Persian message (and the field is focused)
  function bookingFormProblem(){
    const mode = val('f_bookingMode');
    const url = val('f_bookingUrl');
    let code = '';
    let field = '';
    if (mode === 'external' && !url){ code = 'required'; field = 'f_bookingUrl'; }
    else if (url && (code = bookingUrlProblem(url))) field = 'f_bookingUrl';
    else if (val('f_bookingLabel').length > 40){ code = 'length'; field = 'f_bookingLabel'; }
    else if (val('f_bookingNote').length > 200){ code = 'length'; field = 'f_bookingNote'; }
    if (!code) return '';
    const key = field === 'f_bookingUrl' ? 'bookingUrl' : (field === 'f_bookingLabel' ? 'bookingLabel' : 'bookingNote');
    const el = document.getElementById(field);
    if (el) el.focus();
    return BOOKING_MESSAGES[key][code];
  }

  function field(label, id, value, placeholder, type){
    return '<div class="field"><label>' + esc(label) + '</label>' +
      '<input type="' + (type || 'text') + '" id="' + id + '" value="' + esc(value == null ? '' : value) + '"' +
      (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '></div>';
  }
  function selectField(label, id, options, current){
    return '<div class="field"><label>' + esc(label) + '</label><select id="' + id + '">' +
      options.map(function(o){
        return '<option value="' + esc(o) + '"' + (o === current ? ' selected' : '') + '>' + esc(fa(o)) + '</option>';
      }).join('') + '</select></div>';
  }

  function uploadRow(prefix, currentPath, tourId){
    return '<div class="upload-row">' +
      '<div class="field"><input type="text" id="' + prefix + 'Path" value="' + esc(currentPath || '') + '" placeholder="/images/…"></div>' +
      '<input type="file" id="' + prefix + 'File" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
      '<button type="button" class="btn small ghost" id="' + prefix + 'Upload" data-tourid="' + esc(tourId || '') + '">بارگذاری</button>' +
    '</div>';
  }

  function bindCoverUpload(ed){
    const btn = document.getElementById('coverUpload');
    btn.addEventListener('click', async function(){
      const fileInput = document.getElementById('coverFile');
      if (!fileInput.files[0]){ toast('ابتدا یک فایل انتخاب کنید', true); return; }
      btn.disabled = true;
      try {
        const path = await uploadFile(fileInput.files[0], document.getElementById('f_id') ? document.getElementById('f_id').value.trim() : ed.tour.id);
        document.getElementById('coverPath').value = path;
        toast('عکس کاور بارگذاری شد');
      } catch(e){
        toast('بارگذاری ممکن نشد: ' + (e.body && e.body.error || e.message), true);
      } finally { btn.disabled = false; }
    });
  }

  async function uploadFile(file, tourId){
    const fd = new FormData();
    fd.append('file', file);
    if (tourId) fd.append('tourId', tourId);
    const data = await api('/admin/upload', { method:'POST', body: fd });
    return data.path;
  }

  // ---- generic repeatable list (highlights / itinerary / review categories) ----
  function renderRepeat(containerId, items, fields){
    const el = document.getElementById(containerId);
    if (!items.length){
      el.innerHTML = '<p style="color:var(--ink-muted);font-size:13px;">هنوز موردی نیست.</p>';
      return;
    }
    el.innerHTML = items.map(function(item, i){
      const cols = fields.map(function(f){
        const val = item[f.key] == null ? '' : item[f.key];
        const inputHtml = f.area
          ? '<textarea data-i="' + i + '" data-k="' + f.key + '" style="min-height:50px;">' + esc(val) + '</textarea>'
          : '<input type="' + (f.number ? 'number' : 'text') + '" ' + (f.number ? 'step="0.1"' : '') +
            ' data-i="' + i + '" data-k="' + f.key + '" value="' + esc(val) + '">';
        return '<div class="field" style="margin-bottom:0;"><label>' + esc(f.label) + '</label>' + inputHtml + '</div>';
      }).join('');
      return '<div class="repeat-row" style="grid-template-columns:repeat(' + Math.min(fields.length,3) + ',1fr);">' +
        cols + '<button type="button" class="btn small ghost rm" data-i="' + i + '">✕</button></div>';
    }).join('');

    el.querySelectorAll('input, textarea').forEach(function(inp){
      inp.addEventListener('input', function(){
        const i = Number(inp.dataset.i), k = inp.dataset.k;
        items[i][k] = inp.type === 'number' ? (inp.value === '' ? null : Number(inp.value)) : inp.value;
      });
    });
    el.querySelectorAll('.rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        items.splice(Number(btn.dataset.i), 1);
        renderRepeat(containerId, items, fields);
      });

  // ---- highlights: name + description + optional image (with alt text and caption).
  // Saved with the tour (replace-all), so removing an image only edits local state. ----
  function renderHighlightList(ed){
    const el = document.getElementById('highlightsList');

            '<div class="field" style="margin:0"><label>زیرنویس (حداکثر ۱۲۰)</label><input type="text" maxlength="120" data-i="' + i + '" data-k="imageCaption" value="' + esc(h.imageCaption || '') + '"></div>' +

        } finally { btn.disabled = false; }

  // ---- itinerary (own renderer, not the generic renderRepeat: each stage
  // also carries a multi-photo array using the same /admin/upload endpoint
  // and magic-byte/5MB validation as the gallery, just without gallery's
  // per-photo stable ids — the whole itinerary array is bulk-replaced on
  // Save, same as its other fields, so photo removal only needs to edit
  // local state and let Save persist it. ----
  const ITINERARY_FIELDS = [
    { key:'time', label:'برچسب روز (مثلاً روز ۱)' }, { key:'title', label:'عنوان' },
    { key:'description', label:'توضیح', area:true },
    { key:'photoLabel', label:'برچسب عکس' }
  ];

  function renderItineraryList(ed){
    const el = document.getElementById('itineraryList');
    const items = ed.tour.itinerary;
    if (!items.length){
      el.innerHTML = '<p style="color:var(--ink-muted);font-size:13px;">هنوز موردی نیست.</p>';
      return;
    }
    el.innerHTML = items.map(function(item, i){
      const cols = ITINERARY_FIELDS.map(function(f){
        const val = item[f.key] == null ? '' : item[f.key];
        const inputHtml = f.area
          ? '<textarea data-i="' + i + '" data-k="' + f.key + '" style="min-height:50px;">' + esc(val) + '</textarea>'
          : '<input type="text" data-i="' + i + '" data-k="' + f.key + '" value="' + esc(val) + '">';
        return '<div class="field" style="margin-bottom:0;"><label>' + esc(f.label) + '</label>' + inputHtml + '</div>';
      }).join('');
      const images = (item.images || []);
      const photos = images.map(function(img, pi){

          '<img src="' + esc(img.path) + '" onerror="this.style.opacity=0.15" alt="">' +
          '<button type="button" class="iPhotoDel" title="حذف">✕</button>' +
          '<input type="text" class="ialt" maxlength="160" placeholder="متن جایگزین (alt)" data-si="' + i + '" data-pi="' + pi + '" data-ik="alt" value="' + esc(img.alt || '') + '">' +
          '<input type="text" class="ialt" maxlength="120" placeholder="زیرنویس" data-si="' + i + '" data-pi="' + pi + '" data-ik="caption" value="' + esc(img.caption || '') + '">' +
        '</div>';
      }).join('');
      const photoBlock = '<div class="istage-photos">' +
        '<label>عکس‌ها (' + images.length + ' از ' + MAX_ITIN_IMAGES + ')</label>' +
        '<div class="iphoto-grid">' + photos + '</div>' +
        (images.length >= MAX_ITIN_IMAGES ? '' :
        '<div class="upload-row">' +
          '<input type="file" class="iPhotoFile" data-i="' + i + '" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
          '<button type="button" class="btn small ghost iPhotoAdd" data-i="' + i + '">افزودن عکس</button>' +
        '</div>') +
      '</div>';
      return '<div class="repeat-row" style="grid-template-columns:repeat(' + Math.min(ITINERARY_FIELDS.length,3) + ',1fr);">' +
        cols + photoBlock + '<button type="button" class="btn small ghost rm" data-i="' + i + '">✕</button></div>';
    }).join('');

    el.querySelectorAll('input[data-k], textarea[data-k]').forEach(function(inp){
      inp.addEventListener('input', function(){
        const i = Number(inp.dataset.i), k = inp.dataset.k;
        items[i][k] = inp.value;
      });
    });
    el.querySelectorAll('.rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        items.splice(Number(btn.dataset.i), 1);
        renderItineraryList(ed);

    el.querySelectorAll('.iPhotoDel').forEach(function(btn){
      btn.addEventListener('click', function(){
        const cell = btn.closest('.iphoto');

      });

      inp.addEventListener('input', function(){
        items[Number(inp.dataset.si)].images[Number(inp.dataset.pi)][inp.dataset.ik] = inp.value;
      });
    });
    el.querySelectorAll('.iPhotoAdd').forEach(function(btn){
      btn.addEventListener('click', async function(){
        const i = Number(btn.dataset.i);
        const fileInput = el.querySelector('.iPhotoFile[data-i="' + i + '"]');
        if (!fileInput.files[0]){ toast('ابتدا یک فایل انتخاب کنید', true); return; }
        btn.disabled = true;
        try {
          const tourId = document.getElementById('f_id') ? document.getElementById('f_id').value.trim() : ed.tour.id;
          const path = await uploadFile(fileInput.files[0], tourId);
          items[i].images.push({ path: path, alt: '', caption: '' });
          renderItineraryList(ed);
          toast('عکس بارگذاری شد؛ متن جایگزین را بنویسید و «ذخیره» را بزنید');
        } catch(e){
          toast('بارگذاری ممکن نشد: ' + (e.body && e.body.error || e.message), true);
        } finally { btn.disabled = false; }

  // ---- gallery (edit mode only — needs real tour_media ids) ----
  function renderGallerySection(t){
    const photos = (t.galleryMedia || []).map(function(m, i){
      return '<div class="gphoto" data-id="' + m.id + '" draggable="true">' +
        (i === 0 ? '<span class="cover-flag">اصلی</span>' : '') +
        '<img src="' + esc(m.photoPath || '') + '" onerror="this.style.opacity=0.15" alt="" draggable="false">' +
        '<div class="gctrl">' +
          (i > 0 ? '<button type="button" class="gUp" title="جلوتر">↑</button>' : '') +
          (i < t.galleryMedia.length - 1 ? '<button type="button" class="gDown" title="عقب‌تر">↓</button>' : '') +
          '<button type="button" class="gDel" title="حذف">✕</button>' +
        '</div>' +
        '<div class="gcap">' + esc(m.label || '(no label)') + '</div>' +
        '<input type="text" class="ialt gAlt" maxlength="160" placeholder="متن جایگزین (alt)" value="' + esc(m.alt || '') + '">' +
        '<input type="text" class="ialt gCaption" maxlength="120" placeholder="زیرنویس" value="' + esc(m.caption || '') + '">' +
      '</div>';
    }).join('');

    return '<p style="color:var(--ink-muted);font-size:12px;margin-bottom:10px;">با کشیدن عکس‌ها ترتیب را عوض کنید؛ اولی کاور صفحهٔ تجربه است. متن جایگزین و زیرنویس وقتی از فیلد بیرون می‌روید ذخیره می‌شود.</p>' +
      '<div class="gallery-grid" id="galleryGrid">' + (photos || '<p style="color:var(--ink-muted);font-size:13px;">هنوز عکسی نیست.</p>') + '</div>' +
      '<div class="upload-row">' +
        '<div class="field"><label>برچسب عکس تازه</label><input type="text" id="newPhotoLabel" placeholder="مثلاً حرکت هنگام طلوع"></div>' +
        '<input type="file" id="newPhotoFile" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
        '<button type="button" class="btn small primary" id="addPhotoBtn">افزودن عکس</button>' +
      '</div>';
  }

  function bindGallery(ed){
    const grid = document.getElementById('galleryGrid');
    grid.querySelectorAll('.gDel').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = Number(btn.closest('.gphoto').dataset.id);
        deleteGalleryPhoto(ed, id);
      });
    });
    grid.querySelectorAll('.gUp').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = Number(btn.closest('.gphoto').dataset.id);
        moveGalleryPhoto(ed, id, -1);
      });
    });
    grid.querySelectorAll('.gDown').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = Number(btn.closest('.gphoto').dataset.id);
        moveGalleryPhoto(ed, id, 1);
      });
    });
    document.getElementById('addPhotoBtn').addEventListener('click', function(){ addGalleryPhoto(ed); });

    // Alt text / caption: one PUT per image when its field loses focus.
    grid.querySelectorAll('.gphoto').forEach(function(cell){
      const id = Number(cell.dataset.id);
      ['.gAlt', '.gCaption'].forEach(function(sel){
        cell.querySelector(sel).addEventListener('change', async function(){
          try {
            await api('/admin/tours/' + encodeURIComponent(ed.tour.id) + '/gallery/' + id, { method:'PUT',
              body:{ alt: cell.querySelector('.gAlt').value, caption: cell.querySelector('.gCaption').value } });
            toast('ذخیره شد');
          } catch(e){ toast('ذخیرهٔ متن جایگزین / زیرنویس ممکن نشد', true); }
        });
      });
    });

    // Drag to reorder (the arrow buttons remain for keyboard use).
    let dragId = null;
    grid.querySelectorAll('.gphoto').forEach(function(cell){
      cell.addEventListener('dragstart', function(ev){ dragId = Number(cell.dataset.id); cell.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(dragId)); });
      cell.addEventListener('dragend', function(){ cell.classList.remove('dragging'); grid.querySelectorAll('.dragover').forEach(function(c){ c.classList.remove('dragover'); }); });
      cell.addEventListener('dragover', function(ev){ if (dragId == null) return; ev.preventDefault(); cell.classList.add('dragover'); });
      cell.addEventListener('dragleave', function(){ cell.classList.remove('dragover'); });
      cell.addEventListener('drop', async function(ev){
        ev.preventDefault();
        const targetId = Number(cell.dataset.id);
        if (dragId == null || dragId === targetId) return;
        const ids = ed.tour.galleryMedia.map(function(m){ return m.id; });
        ids.splice(ids.indexOf(dragId), 1);
        ids.splice(ids.indexOf(targetId), 0, dragId);
        dragId = null;
        try {
          await api('/admin/tours/' + encodeURIComponent(ed.tour.id) + '/gallery/reorder', { method:'PUT', body:{ order: ids } });
          await refreshGalleryFull(ed);
        } catch(e){ toast('جابه‌جایی ممکن نشد', true); }
      });
    });
  }

  async function deleteGalleryPhoto(ed, mediaId){
    if (!confirm('این عکس حذف شود؟ بازگشت ندارد.')) return;
    try {
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id) + '/gallery/' + mediaId, { method:'DELETE' });
      toast('عکس حذف شد');
      await refreshGalleryFull(ed);
    } catch(e){ toast('حذف ممکن نشد', true); }
  }

  async function moveGalleryPhoto(ed, mediaId, dir){
    const ids = ed.tour.galleryMedia.map(function(m){ return m.id; });
    const i = ids.indexOf(mediaId);
    const j = i + dir;
    if (j < 0 || j >= ids.length) return;
    const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    try {
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id) + '/gallery/reorder', { method:'PUT', body:{ order: ids } });
      await refreshGalleryFull(ed);
    } catch(e){ toast('جابه‌جایی ممکن نشد', true); }
  }

  async function addGalleryPhoto(ed){
    const fileInput = document.getElementById('newPhotoFile');
    const label = document.getElementById('newPhotoLabel').value.trim();
    if (!fileInput.files[0]){ toast('ابتدا یک فایل انتخاب کنید', true); return; }
    const btn = document.getElementById('addPhotoBtn');
    btn.disabled = true;
    try {
      const path = await uploadFile(fileInput.files[0], ed.tour.id);
      const galleryImages = ed.tour.gallery.concat([label]);
      const galleryPhotos = ed.tour.galleryPhotos.concat([path]);
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id), {
        method:'PUT', body:{ galleryImages: galleryImages, galleryPhotos: galleryPhotos }
      });
      toast('عکس اضافه شد');
      await refreshGalleryFull(ed);
    } catch(e){
      toast('بارگذاری یا ذخیره ممکن نشد', true);
    } finally { btn.disabled = false; }
  }

  // Re-fetches the tour and repaints just the gallery <section> in place.
  async function refreshGalleryFull(ed){
    const data = await api('/admin/tours/' + encodeURIComponent(ed.tour.id));
    ed.tour = Object.assign(ed.tour, data.tour);
    document.getElementById('galleryPanel').innerHTML = renderGallerySection(ed.tour);
    bindGallery(ed);
  }


  // ---------------------------------------------------------------------
  // Editions: dates + capacity (one row per bookable run of a tour)
  // ---------------------------------------------------------------------
  const PHASE_LABEL = { upcoming: 'پیشِ رو', past: 'برگزار شد', undated: 'بدون تاریخ' };
  const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;

  // Shows the Jalali equivalent of the Gregorian date the <input type=date>
  // holds, so an admin can sanity-check "۱۲ مهر ۱۴۰۵" against the label.
  function faDate(iso){
    if (!ISO_RE.test(iso || '')) return '';
    try {
      return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { dateStyle: 'long', timeZone: 'UTC' })
        .format(new Date(iso + 'T00:00:00Z'));
    } catch(e){ return ''; }
  }

  function editionRow(d){
    const isNew = d.id == null;
    const phase = d.phase || 'undated';
    return '<tr data-id="' + (isNew ? '' : d.id) + '" class="' + (phase === 'past' ? 'is-past' : '') + '">' +
      '<td><input type="text" class="e_label" dir="auto" value="' + esc(d.label) + '" placeholder="۱۲ مهر"></td>' +
      '<td><input type="date" class="e_start" value="' + esc(d.startsOn || '') + '"><div class="fa e_start_fa">' + esc(faDate(d.startsOn)) + '</div></td>' +
      '<td><input type="date" class="e_end" value="' + esc(d.endsOn || '') + '"><div class="fa e_end_fa">' + esc(faDate(d.endsOn)) + '</div></td>' +
      '<td><input type="number" class="e_cap" min="0" step="1" value="' + esc(d.capacity == null ? '' : d.capacity) + '" style="width:80px"></td>' +
      '<td>' + (isNew ? '—' : esc(d.seatsTaken)) + '</td>' +
      '<td><div class="checkline"><input type="checkbox" class="e_closed"' + (d.closed ? ' checked' : '') + '></div></td>' +
      '<td>' + (isNew ? '' : '<span class="badge ' + phase + '">' + PHASE_LABEL[phase] + '</span>') + '</td>' +
      '<td style="white-space:nowrap"><button type="button" class="btn small primary e_save">' + (isNew ? 'افزودن' : 'ذخیره') + '</button></td>' +
    '</tr>';
  }

  function paintEditions(tourId, dates){
    const panel = document.getElementById('editionsPanel');
    if (!panel) return;
    const rows = dates.map(editionRow).join('') + editionRow({ id: null, label: '', startsOn: '', endsOn: '', capacity: '', closed: false });
    panel.innerHTML =
      '<p style="color:var(--ink-muted);font-size:13px;margin-bottom:14px;">' +
        'تاریخ‌ها میلادی‌اند (تاریخ شمسی زیر آن‌ها دیده می‌شود). وقتی آخرین روز یک اجرا بگذرد «برگزار شد» نشان داده می‌شود و دیگر رزرو نمی‌شود. ' +
        'اجرای بدون تاریخ تا وقتی تاریخ نگذاشته‌اید قابل رزرو می‌ماند. برای اجرای یک‌روزه «پایان» را خالی بگذارید.' +
      '</p>' +

    catch(e){

  async function saveEdition(tourId, tr, btn){
    const q = function(sel){ return tr.querySelector(sel); };
    const id = tr.getAttribute('data-id');
    const label = q('.e_label').value.trim();
    const capRaw = q('.e_cap').value.trim();
    const capacity = capRaw === '' ? NaN : Number(capRaw);
    const startsOn = q('.e_start').value || null;
    const endsOn = q('.e_end').value || null;

    if (!label) { toast('برچسب لازم است', true); return; }
    if (!Number.isInteger(capacity) || capacity < 0) { toast('ظرفیت باید عدد صحیح ۰ یا بیشتر باشد', true); return; }
    if (endsOn && !startsOn) { toast('ابتدا تاریخ شروع را بگذارید', true); return; }
    if (startsOn && endsOn && endsOn < startsOn) { toast('تاریخ پایان قبل از شروع است', true); return; }

    btn.disabled = true;
    try {
      if (id) {
        await api('/admin/tour-dates/' + id, { method: 'PUT',
          body: { label: label, capacity: capacity, startsOn: startsOn, endsOn: endsOn, closed: q('.e_closed').checked } });
      } else {
        const body = { label: label, capacity: capacity };
        if (startsOn) body.startsOn = startsOn;
        if (endsOn) body.endsOn = endsOn;
        await api('/admin/tours/' + encodeURIComponent(tourId) + '/dates', { method: 'POST', body: body });
      }
      toast(id ? 'تاریخ ذخیره شد' : 'تاریخ اضافه شد');
      await loadEditions(tourId);
    } catch(e){
      const f = e.body && e.body.fields;
      toast(f ? 'تاریخ نامعتبر: ' + Object.keys(f).join('، ') : 'ذخیرهٔ تاریخ ممکن نشد (' + e.message + ')', true);
      btn.disabled = false;
    }
  }

  function readEditorFields(ed){
    const t = ed.tour;
    const patch = {
      name: val('f_name'), status: val('f_status'), duration: val('f_duration'),
      price: numOrNull('f_price'), tags: val('f_tags'), subtitleEn: val('f_subtitleEn'),
      dayLabel: val('f_dayLabel'), monthLabel: val('f_monthLabel'),
      photoPath: val('coverPath'), featured: document.getElementById('f_featured').checked,
      description: val('f_description'), included: val('f_included'),
      story: val('f_story'), region: val('f_region'), experienceType: val('f_experienceType'),
      level: val('f_level'), bringList: val('f_bringList'), seoDescription: val('f_seoDescription'),
      bookingMode: val('f_bookingMode') || 'online', bookingUrl: val('f_bookingUrl'),
      bookingLabel: val('f_bookingLabel'), bookingNote: val('f_bookingNote'),
      highlights: t.highlights.filter(function(h){ return h.name; }),
      itinerary: t.itinerary.filter(function(s){ return s.title; }),
      reviewCategories: t.reviewCategories.filter(function(c){ return c.label; })
    };
    if (ed.isNew){
      patch.galleryImages = t.gallery || [];
      patch.galleryPhotos = t.galleryPhotos || [];
    }
    return patch;
  }
  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function numOrNull(id){ const v = val(id); return v === '' ? null : Number(v); }

  async function saveTour(ed){
    const msg = document.getElementById('editorMsg');
    const btn = document.getElementById('saveBtn');
    msg.textContent = '';

    if (ed.isNew){
      const id = val('f_id');
      if (!TOUR_ID_RE.test(id)){
        msg.textContent = 'شناسهٔ تجربه فقط حروف کوچک انگلیسی، عدد و خط تیره باشد (مثلاً desert-parthian).';
        return;
      }
      ed.tour.id = id;
    }
    const patch = readEditorFields(ed);
    if (!patch.name){ msg.textContent = 'عنوان لازم است.'; return; }
    const bookingMsg = document.getElementById('bookingMsg');
    if (bookingMsg) bookingMsg.textContent = '';
    const bookingProblem = bookingFormProblem();
    if (bookingProblem){
      if (bookingMsg) bookingMsg.textContent = bookingProblem;
      msg.textContent = bookingProblem;
      return;
    }

    const featuredWithoutDate = patch.featured && (!patch.dayLabel || !patch.monthLabel);
    const savedMsg = featuredWithoutDate
      ? 'ذخیره شد — اما تجربهٔ «ویژه» برای نمایش در صفحهٔ اول، هم روز و هم ماه روی کارت را لازم دارد.'
      : null;

    btn.disabled = true;
    try {
      if (ed.isNew){
        patch.id = ed.tour.id;
        await api('/admin/tours', { method:'POST', body: patch });
        toast(savedMsg || 'تجربه ساخته شد', featuredWithoutDate);
        location.hash = '#/tours/' + encodeURIComponent(ed.tour.id) + '/edit';
        route();
      } else {
        await api('/admin/tours/' + encodeURIComponent(ed.tour.id), { method:'PUT', body: patch });
        toast(savedMsg || 'ذخیره شد', featuredWithoutDate);
        renderEditor(ed.tour.id);
      }
    } catch(e){
      if (e.status === 409) msg.textContent = 'این شناسه قبلاً استفاده شده است.';
      else if (e.status === 422 && bookingFieldMessage(e.body && e.body.fields)) {
        msg.textContent = bookingFieldMessage(e.body.fields);
        if (bookingMsg) bookingMsg.textContent = msg.textContent;
      }
      else if (e.status === 422) msg.textContent = 'این فیلدها را بررسی کنید: ' + Object.keys((e.body && e.body.fields) || {}).join(', ');
      else msg.textContent = 'ذخیره نشد. دوباره تلاش کنید.';
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteTour(ed){
    if (!confirm('«' + ed.tour.name + '» حذف شود؟ بازگشت ندارد.')) return;
    try {
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id), { method:'DELETE' });
      toast('تجربه حذف شد');
      location.hash = '#/tours';
      route();
    } catch(e){
      if (e.status === 409) toast('حذف ممکن نیست: این تجربه رزرو واقعی دارد. به‌جای حذف، آن را بایگانی کنید.', true);
      else toast('حذف ممکن نشد', true);
    }
  }

          }).join('') +
        '</select>' +
        '<p style="color:var(--ink-muted);font-size:12px;margin-top:6px;">' +
          '<b>پنهان</b> یعنی پروفایل اصلاً روی سایت نیست (/host/&lt;slug&gt; «پیدا نشد» می‌دهد و از تجربه‌هایی که به آن‌ها وصل است هم حذف می‌شود). ' +
          '<b>فعال</b> آن را منتشر می‌کند.</p></div>' +
        '<div class="field"><label><input type="checkbox" id="h_verified"' + (host.verified ? ' checked' : '') + '> تأییدشده توسط چکمه</label>' +

  async function uploadHostImage(ed, file){
    const fd = new FormData();
    fd.append('file', file);
    fd.append('hostSlug', ed.host.slug);
    return api('/admin/upload', { method:'POST', body: fd });
  }

  // ---- amenities (places only) ----------------------------------------
  // A flat list of short labels, edited as chips: the server stores at most
  // 20 of them, each at most 40 characters.

        '<b>با دو رقم اعشار (حدود ۱ کیلومتر)</b> و به‌صورت یک محدوده نشان می‌دهد، نه نقطهٔ دقیق و نه نشانی. ' +

  function drawAmenities(ed){
    const box = document.getElementById('h_amenityChips');
    if (!box) return;
    box.innerHTML = ed.amenities.length
      ? ed.amenities.map(function(a, i){
          return '<span class="chip">' + esc(a) + '<button type="button" class="chip-x" data-i="' + i + '" title="حذف">×</button></span>';
        }).join('')
      : '<span style="color:var(--ink-muted);font-size:13px;">هنوز موردی نیست.</span>';
    box.querySelectorAll('.chip-x').forEach(function(btn){
      btn.addEventListener('click', function(){
        ed.amenities.splice(Number(btn.dataset.i), 1);
        drawAmenities(ed);
      });
    });
  }

  function bindAmenities(ed){
    drawAmenities(ed);
    const input = document.getElementById('h_amenityInput');
    const addIt = function(){
      const v = (input.value || '').trim();
      if (!v) return;
      if (ed.amenities.length >= 20){ toast('حداکثر ۲۰ مورد', true); return; }
      if (ed.amenities.indexOf(v) !== -1){ toast('قبلاً اضافه شده است', true); input.value = ''; return; }
      ed.amenities.push(v);
      input.value = '';
      drawAmenities(ed);
    };
    document.getElementById('h_amenityAdd').addEventListener('click', addIt);
    input.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){ ev.preventDefault(); addIt(); }
    });
  }

  // ---- gallery (host_media) -------------------------------------------
  // Saved on its own button, not with the profile: the endpoint replaces the
  // whole list in one transaction, so a half-built gallery must never be sent.
  function drawHostMedia(ed){
    const panel = document.getElementById('hostMediaPanel');
    if (!panel) return;
    const rows = ed.media.map(function(m, i){
      return '<div class="th-row media-row" data-i="' + i + '">' +
        '<div class="th-ord">' +
          '<button type="button" class="gm-up"' + (i === 0 ? ' disabled' : '') + ' title="بالا">↑</button>' +
          '<button type="button" class="gm-down"' + (i === ed.media.length - 1 ? ' disabled' : '') + ' title="پایین">↓</button>' +
        '</div>' +
        '<div class="gm-thumb"><img src="' + esc(m.photoPath) + '" alt=""></div>' +
        '<input type="text" class="gm-caption" maxlength="120" aria-label="زیرنویس" placeholder="زیرنویس (اختیاری)" value="' + esc(m.caption || '') + '">' +
        '<input type="text" class="gm-alt" maxlength="160" aria-label="متن جایگزین" placeholder="متن جایگزین (alt)" value="' + esc(m.alt || '') + '">' +
        '<button type="button" class="btn small danger gm-rm">حذف</button>' +
      '</div>';
    }).join('');

    panel.innerHTML =
      '<h2>گالری <span class="where">روی صفحه: «فضا و حال‌وهوا» با زیرنویس و متن جایگزین</span></h2>' +
      (ed.media.length ? rows : '<p style="color:var(--ink-muted);font-size:13px;">هنوز عکسی نیست.</p>') +
      '<div class="th-add">' +
        '<input type="file" id="gmFile" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
        '<button type="button" class="btn small ghost" id="gmAdd">+ بارگذاری</button>' +
        '<button type="button" class="btn small primary" id="gmSave">ذخیرهٔ گالری</button>' +
        '<span class="msg" id="gmMsg" style="font-size:13px;color:var(--ink-muted);"></span>' +
      '</div>' +
      '<p style="color:var(--ink-muted);font-size:12px;margin-top:12px;">' +
        'با همین ترتیب روی صفحهٔ عمومی نمایش داده می‌شود. بارگذاری، عکس را همان لحظه اضافه می‌کند؛ ' +
        '<b>ذخیرهٔ گالری</b> فهرست، ترتیب، زیرنویس‌ها و متن‌های جایگزین را ذخیره می‌کند.</p>';

    panel.querySelectorAll('.gm-rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        ed.media.splice(Number(btn.closest('.media-row').dataset.i), 1);
        drawHostMedia(ed);
      });
    });
    panel.querySelectorAll('.gm-up').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.media-row').dataset.i);
        ed.media.splice(i - 1, 0, ed.media.splice(i, 1)[0]);
        drawHostMedia(ed);
      });
    });
    panel.querySelectorAll('.gm-down').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.media-row').dataset.i);
        ed.media.splice(i + 1, 0, ed.media.splice(i, 1)[0]);
        drawHostMedia(ed);
      });
    });
    panel.querySelectorAll('.gm-alt').forEach(function(input){
      input.addEventListener('input', function(){
        ed.media[Number(input.closest('.media-row').dataset.i)].alt = input.value;
      });
    });
    panel.querySelectorAll('.gm-caption').forEach(function(input){
      input.addEventListener('input', function(){
        ed.media[Number(input.closest('.media-row').dataset.i)].caption = input.value;
      });
    });

    document.getElementById('gmAdd').addEventListener('click', async function(){
      const f = document.getElementById('gmFile');
      if (!f.files || !f.files[0]) { toast('ابتدا یک عکس انتخاب کنید', true); return; }
      this.disabled = true;
      try {
        const data = await uploadHostImage(ed, f.files[0]);
        ed.media.push({ photoPath: data.path, caption: '', alt: '' });
        drawHostMedia(ed);
        toast('بارگذاری شد؛ گالری را ذخیره کنید');
      } catch(e){
        toast(e.status === 422 ? 'این فایل پذیرفته نشد (فقط png / jpeg / webp)' : 'بارگذاری ممکن نشد', true);
        this.disabled = false;
      }
    });

    document.getElementById('gmSave').addEventListener('click', async function(){
      const msg = document.getElementById('gmMsg');
      msg.textContent = '';
      this.disabled = true;
      try {
        await api('/admin/hosts/' + ed.host.id + '/media', { method:'PUT', body: { media: ed.media } });
        toast('گالری ذخیره شد');
      } catch(e){
        if (e.status === 401){ state.admin = null; renderLogin(); return; }
        msg.textContent = e.status === 422 ? 'یکی از عکس‌ها پذیرفته نشد. دوباره بارگذاری کنید.' : 'ذخیرهٔ گالری ممکن نشد.';
      } finally { this.disabled = false; }
    });
  }

  function splitTags(text){
    return String(text || '').split(/[,،\n]/).map(function(t){ return t.trim(); }).filter(Boolean);
  }

  function hostPatchFromForm(ed){
    const patch = {
      kind: ed.host.kind,
      displayName: (document.getElementById('h_name').value || '').trim(),
      bio: (document.getElementById('h_bio').value || '').trim(),
      instagramHandle: (document.getElementById('h_instagram').value || '').trim(),
      contactPhone: (document.getElementById('h_phone').value || '').trim(),
      photoPath: ed.photoPath || '',
      status: document.getElementById('h_status').value,
      verified: document.getElementById('h_verified').checked
    };
    if (ed.isPlace){
      patch.region = (document.getElementById('h_region').value || '').trim();
      patch.regionKey = document.getElementById('h_regionKey').value;
      patch.lodgingType = (document.getElementById('h_lodging').value || '').trim();
      patch.amenities = ed.amenities;
      // Sent as-is (empty string included): the server treats "" as absent,
      // and a half-filled pair is a 422 rather than a guess at the other half.
      patch.latitude = (document.getElementById('h_lat').value || '').trim();
      patch.longitude = (document.getElementById('h_lng').value || '').trim();
      patch.capacityGuests = (document.getElementById('h_capacity').value || '').trim();
      patch.houseRules = (document.getElementById('h_rules').value || '').trim();
      patch.acceptsExperienceTypes = splitTags(document.getElementById('h_accepts').value);
    } else {
      patch.expertise = (document.getElementById('h_expertise').value || '').trim();
      patch.credentials = (document.getElementById('h_credentials').value || '').trim();
      patch.credentialsPublic = document.getElementById('h_credentialsPublic').checked;
      patch.seekingPlaceTypes = splitTags(document.getElementById('h_seeking').value);
    }
    return patch;
  }

  // Maps the server's per-field 422 codes onto the field they belong to, so a
  // rejected save says which input is wrong instead of "check the fields".
  const HOST_FIELD_MSG = {
    displayName: 'نام لازم است (حداکثر ۸۰ نویسه).',
    bio: 'معرفی بیش از ۱۵۰۰ نویسه است.',

    region: 'منطقه بیش از ۱۲۰ نویسه است.',
    lodgingType: 'نوع اقامت بیش از ۶۰ نویسه است.',
    amenities: 'امکانات حداکثر ۲۰ مورد و هر کدام ۴۰ نویسه.',

    longitude: 'طول جغرافیایی باید عددی داخل ایران باشد (تقریباً ۴۳ تا ۶۴).',

    instagramHandle: 'نام کاربری اینستاگرام معتبر نیست؛ بدون @ و لینک.',
    contactPhone: 'تلفن تماس شمارهٔ موبایل معتبر ایرانی نیست.',
    photoPath: 'مسیر عکس از بارگذاری‌های خودمان نیست. دوباره بارگذاری کنید.',
    credentials: 'سوابق بیش از ۶۰۰ نویسه است.',
    capacityGuests: 'ظرفیت باید عدد صحیح ۱ تا ۵۰۰ باشد.',
    houseRules: 'قوانین بیش از ۱۰۰۰ نویسه است.',
    seekingPlaceTypes: 'حداکثر ۱۰ مورد و هر کدام ۴۰ نویسه.',
    acceptsExperienceTypes: 'حداکثر ۱۰ مورد و هر کدام ۴۰ نویسه.',
    status: 'وضعیت باید پنهان یا فعال باشد.',
    slug: 'نشانی (slug) باید ۲ تا ۴۰ حرف کوچک انگلیسی، عدد یا خط تیره باشد.'
  };

  function hostErrorText(e){
    if (e.status === 409) return 'این نشانی قبلاً استفاده شده است.';
    if (e.status === 422 && e.body && e.body.fields){
      const msgs = Object.keys(e.body.fields).map(function(f){ return HOST_FIELD_MSG[f] || (f + ' نامعتبر است.'); });
      if (msgs.length) return msgs.join(' ');
    }
    return 'ذخیره نشد. دوباره تلاش کنید.';
  }

  async function saveHost(ed){
    const msg = document.getElementById('hostMsg');
    const btn = document.getElementById('hostSaveBtn');
    msg.textContent = '';

    const patch = hostPatchFromForm(ed);
    if (!patch.displayName){ msg.textContent = 'عنوان لازم است.'; return; }
    if (ed.isPlace && !patch.region){ msg.textContent = 'مکان باید منطقه داشته باشد.'; return; }

    let slug = ed.host.slug;
    if (ed.isNew){
      slug = (document.getElementById('h_slug').value || '').trim();
      if (!HOST_SLUG_RE.test(slug)){
        msg.textContent = 'نشانی (slug) باید ۲ تا ۴۰ حرف کوچک انگلیسی، عدد یا خط تیره باشد (مثلاً arash-niko).';
        return;
      }
    }

    btn.disabled = true;
    try {
      if (ed.isNew){
        const created = await api('/admin/hosts', { method:'POST', body: Object.assign({ slug: slug }, patch) });
        toast('پروفایل ساخته شد');
        location.hash = '#/hosts/' + created.host.id + '/edit';
        route();
      } else {
        await api('/admin/hosts/' + ed.host.id, { method:'PUT', body: patch });
        toast('ذخیره شد');
        renderHostEditor(ed.host.id);
      }
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      msg.textContent = hostErrorText(e);
    } finally {
      btn.disabled = false;
    }
  }

  // ---------------------------------------------------------------------
  // Applications ("become an organizer" submissions)
  // ---------------------------------------------------------------------
  function slugSuggestion(fullName){
    // Latin names give a usable slug; Persian ones do not, so leave it blank
    // rather than emit an empty or mangled one the admin might not notice.
    const s = String(fullName || '').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return HOST_SLUG_RE.test(s) ? s : '';
  }

  async function renderApplications(){
    app.innerHTML = shell('<div class="empty">در حال بارگذاری…</div>');
    bindLogout();
    try {
      const qs = state.applicationsFilter ? ('?status=' + encodeURIComponent(state.applicationsFilter)) : '';
      const data = await api('/admin/host-applications' + qs);
      state.applications = data.applications;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('بارگذاری درخواست‌ها ممکن نشد', true);
      state.applications = [];
    }

    const filterOptions = ['', 'pending', 'approved', 'rejected'].map(function(v){
      return '<option value="' + v + '"' + (state.applicationsFilter === v ? ' selected' : '') + '>' + (v ? fa(v) : 'همه') + '</option>';
    }).join('');

    const cards = state.applications.map(function(a){
      const pending = a.status === 'pending';
      return (
        '<div class="app-card" data-id="' + a.id + '">' +
          '<div class="app-top">' +
            '<b>' + esc(a.fullName) + '</b>' +
            '<span class="badge ' + esc(a.kind) + '">' + esc(KIND_LABEL[a.kind] || a.kind) + '</span>' +
            '<span class="badge ' + esc(a.status) + '">' + esc(fa(a.status)) + '</span>' +
            '<span class="app-meta">' + esc(String(a.createdAt || '').slice(0, 16).replace('T', ' ')) + '</span>' +
          '</div>' +
          // The applicant's identity comes from their account, not the form —
          // admin-only, and never part of any public response.
          '<div class="app-meta">' +
            'حساب: ' + (a.applicant
              ? esc(a.applicant.firstName + ' ' + a.applicant.lastName) + ' · <span dir="ltr">' + esc(a.applicant.phone) + '</span>'
              : '<i>بدون حساب (قبل از اجباری شدن ورود ثبت شده)</i>'
                + (a.phone ? ' · <span dir="ltr">' + esc(a.phone) + '</span>' : '')) +
          '</div>' +
          '<div class="app-meta">' +
            (a.instagramHandle ? 'اینستاگرام: <span dir="ltr">@' + esc(a.instagramHandle) + '</span> · ' : '') +
            (a.kind === 'place'
              ? [a.lodgingType, a.region, a.capacityGuests ? ('ظرفیت ~' + a.capacityGuests + ' نفر') : ''].filter(Boolean).map(esc).join(' · ')
              : esc(a.expertise || '')) +

          '<div class="app-desc">' + esc(a.description) + '</div>' +
          (a.adminNote ? '<div class="app-meta">یادداشت: ' + esc(a.adminNote) + '</div>' : '') +
          (a.hostId ? '<div class="app-meta">→ <a href="#/hosts/' + a.hostId + '/edit">باز کردن پروفایل</a></div>' : '') +
          (pending
            ? '<div class="app-actions">' +
                '<div class="field"><label>نشانی (slug) پروفایل جدید</label>' +
                  '<input type="text" class="app-slug" value="' + esc(slugSuggestion(a.fullName)) + '" placeholder="arash-niko"></div>' +
                '<button class="btn small primary app-approve">پذیرش</button>' +
                '<button class="btn small danger app-reject">رد</button>' +

                'پذیرش یک پروفایل <b>پنهان</b> ' + esc(KIND_LABEL[a.kind] || a.kind) +
                ' از روی همین درخواست می‌سازد؛ مالک آن حساب درخواست‌دهنده است و ' +
                'شمارهٔ حسابش تلفن داخلی تماس می‌شود. تا وقتی پروفایل را کامل نکنید و فعال نکنید چیزی روی سایت نمی‌آید.</p>'

      state.applicationsFilter = this.value;

        approveApplication(Number(card.dataset.id), card.querySelector('.app-slug').value.trim(), btn);

      btn.addEventListener('click', function(){
        rejectApplication(Number(btn.closest('.app-card').dataset.id), btn);

  async function approveApplication(id, slug, btn){
    if (!HOST_SLUG_RE.test(slug)){
      toast('نشانی (slug) باید ۲ تا ۴۰ حرف کوچک انگلیسی، عدد یا خط تیره باشد', true);
      return;
    }
    btn.disabled = true;
    try {
      const data = await api('/admin/host-applications/' + id + '/approve', { method:'POST', body: { slug: slug } });
      toast('پذیرفته شد؛ پروفایل را کامل کنید و فعال کنید');
      location.hash = '#/hosts/' + data.host.id + '/edit';
      route();
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      if (e.status === 409) toast('این نشانی قبلاً استفاده شده است', true);
      else if (e.status === 404) toast('این درخواست دیگر در انتظار نیست', true);
      else toast('پذیرش ممکن نشد', true);
      btn.disabled = false;
    }
  }

  async function rejectApplication(id, btn){
    const note = prompt('این درخواست رد شود؟\n\nیادداشت داخلی (اختیاری؛ برای درخواست‌دهنده ارسال نمی‌شود):');
    if (note === null) return;
    btn.disabled = true;
    try {
      await api('/admin/host-applications/' + id + '/reject', { method:'POST', body: { adminNote: note } });
      toast('درخواست رد شد');
      renderApplications();
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      if (e.status === 404) toast('این درخواست دیگر در انتظار نیست', true);
      else toast('رد ممکن نشد', true);
      btn.disabled = false;
    }
  }

  // ---------------------------------------------------------------------
  // Owner edits awaiting review (host_revisions)
  // ---------------------------------------------------------------------
  const REV_LABELS = {
    displayName: 'نام', bio: 'معرفی', photoPath: 'عکس', instagramHandle: 'اینستاگرام',
    expertise: 'زمینهٔ تخصص', credentials: 'سوابق و گواهینامه‌ها', credentialsPublic: 'نمایش عمومی سوابق', seekingPlaceTypes: 'نوع مکان مطلوب (داخلی)',
    region: 'منطقه', lodgingType: 'نوع اقامت', amenities: 'امکانات', capacityGuests: 'ظرفیت',
    houseRules: 'قوانین مکان', acceptsExperienceTypes: 'تجربه‌های پذیرفته‌شده (داخلی)',
    latitude: 'عرض جغرافیایی (دقیق، خصوصی)', longitude: 'طول جغرافیایی (دقیق، خصوصی)', media: 'گالری'
  };


  function revValueHtml(key, v){
    if (key === 'photoPath') return v ? '<span class="rev-thumbs">' + hostPhotoHtml(v) + '</span>' : '<i>—</i>';
    if (key === 'media'){
      return (v && v.length)
        ? '<span class="rev-thumbs">' + v.map(function(m){
            return '<span class="rev-thumb" title="' + esc(m.caption || '') + '"><img src="' + esc(imgSrc(m.photoPath)) + '" alt=""></span>';
          }).join('') + '</span><div class="app-meta">' + v.length + ' عکس</div>'
        : '<i>هیچ</i>';
    }
    if (key === 'credentialsPublic') return v ? 'عمومی' : 'فقط چکمه';
    if (Array.isArray(v)) return v.length ? v.map(esc).join('، ') : '<i>—</i>';
    if (v == null || v === '') return '<i>—</i>';
    return esc(String(v));
  }

  function revSame(key, a, b){
    if (key === 'media'){
      const norm = function(x){ return JSON.stringify((x || []).map(function(m){ return [m.photoPath, m.caption || null, m.alt || null]; })); };
      return norm(a) === norm(b);
    }
    return JSON.stringify(a == null || a === '' ? null : a) === JSON.stringify(b == null || b === '' ? null : b);
  }

  async function renderRevisions(){
    app.innerHTML = shell('<div class="empty">در حال بارگذاری…</div>');
    bindLogout();
    let list = [];
    try {
      const qs = state.revisionsFilter ? ('?status=' + encodeURIComponent(state.revisionsFilter)) : '';
      list = (await api('/admin/host-revisions' + qs)).revisions;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('بارگذاری بازبینی‌ها ممکن نشد', true);
    }
    const filterOptions = ['pending', 'approved', 'rejected', ''].map(function(v){
      return '<option value="' + v + '"' + (state.revisionsFilter === v ? ' selected' : '') + '>' + (v ? fa(v) : 'همه') + '</option>';
    }).join('');
    const cards = list.map(function(r){
      const keys = Object.keys(r.payload).filter(function(k){ return REV_LABELS[k]; });
      const changed = keys.filter(function(k){ return !revSame(k, r.current[k], r.payload[k]); });
      const rows = changed.map(function(k){
        return '<tr><td class="rev-k">' + esc(REV_LABELS[k]) + '</td>' +
          '<td class="rev-old">' + revValueHtml(k, r.current[k]) + '</td>' +
          '<td class="rev-new">' + revValueHtml(k, r.payload[k]) + '</td></tr>';
      }).join('');
      const pending = r.status === 'pending';
      return (
        '<div class="app-card" data-id="' + r.id + '">' +
          '<div class="app-top"><b>' + esc(r.host.displayName) + '</b>' +
            '<span class="badge ' + esc(r.host.kind) + '">' + esc(KIND_LABEL[r.host.kind] || r.host.kind) + '</span>' +
            '<span class="badge ' + esc(r.status) + '">' + esc(fa(r.status)) + '</span>' +
            '<span class="app-meta">' + esc(String(r.createdAt || '').slice(0, 16).replace('T', ' ')) + '</span></div>' +
          '<div class="app-meta">مالک: ' + (r.owner ? esc(r.owner.firstName + ' ' + r.owner.lastName) + ' · <span dir="ltr">' + esc(r.owner.phone) + '</span>' : '<i>—</i>') +
            ' · <a href="#/hosts/' + r.host.id + '/edit">باز کردن پروفایل</a></div>' +
          (changed.length
            ? '<table class="tours rev-table"><thead><tr><th>فیلد</th><th>فعلی</th><th>پیشنهادی</th></tr></thead><tbody>' + rows + '</tbody></table>'
            : '<div class="app-meta"><i>هیچ فیلدی با پروفایل فعلی فرق ندارد.</i></div>') +
          (r.adminNote ? '<div class="app-meta">یادداشت: ' + esc(r.adminNote) + '</div>' : '') +
          (pending
            ? '<div class="app-actions"><button class="btn small primary rev-approve">پذیرش و اعمال</button>' +
              '<button class="btn small danger rev-reject">رد</button></div>'
            : '') +
        '</div>'
      );
    }).join('');
    app.innerHTML = shell(
      '<div class="list-head"><h1>بازبینی تغییرات</h1></div>' +
      '<div class="filter-row"><label>وضعیت</label><select id="revFilter">' + filterOptions + '</select></div>' +
      (list.length ? cards : '<div class="empty">موردی نیست.</div>')
    );
    bindLogout();
    document.getElementById('revFilter').addEventListener('change', function(){ state.revisionsFilter = this.value; renderRevisions(); });
    app.querySelectorAll('.rev-approve').forEach(function(btn){
      btn.addEventListener('click', async function(){
        btn.disabled = true;
        try {
          await api('/admin/host-revisions/' + Number(btn.closest('.app-card').dataset.id) + '/approve', { method:'POST', body: {} });
          toast('روی پروفایل اعمال شد');
          renderRevisions();
        } catch(e){
          if (e.status === 401){ state.admin = null; renderLogin(); return; }
          toast(e.status === 404 ? 'این مورد دیگر در انتظار نیست' : 'پذیرش ممکن نشد', true);
          btn.disabled = false;
        }
      });
    });
    app.querySelectorAll('.rev-reject').forEach(function(btn){
      btn.addEventListener('click', async function(){
        const note = prompt('این تغییرات رد شود؟\n\nیادداشت (اختیاری؛ مالک آن را می‌بیند):');
        if (note === null) return;
        btn.disabled = true;
        try {
          await api('/admin/host-revisions/' + Number(btn.closest('.app-card').dataset.id) + '/reject', { method:'POST', body: { adminNote: note } });
          toast('رد شد');
          renderRevisions();
        } catch(e){
          if (e.status === 401){ state.admin = null; renderLogin(); return; }
          toast(e.status === 404 ? 'این مورد دیگر در انتظار نیست' : 'رد ممکن نشد', true);
          btn.disabled = false;
        }
      });
    });
  }

  // ---------------------------------------------------------------------
