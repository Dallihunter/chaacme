<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAACME — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --paper:#fafaf9; --ink:#0a0a0a; --ink-soft:#4a4a4a; --ink-faint:#8a8a86;
    --line:#dcdcd8; --line-soft:#ececea; --danger:#a83232; --danger-bg:#fbeceb; --ok:#2f7a4f; --maxw:1040px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; font-weight:400;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:500; letter-spacing:-0.01em; line-height:1.15; }
  a{ color:inherit; }
  input,select,textarea,button{ font-family:inherit; font-size:inherit; color:inherit; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; }
  [hidden]{ display:none !important; }

  /* ---- shell ---- */
  header.topbar{
    border-bottom:1px solid var(--line-soft); position:sticky; top:0; background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px); z-index:10;
  }
  .topbar-inner{ max-width:var(--maxw); margin:0 auto; padding:18px 28px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-family:'Fraunces',serif; font-size:18px; letter-spacing:0.01em; }
  .logo b{ font-weight:600; }
  .logo span{ color:var(--ink-faint); font-weight:400; font-size:14px; margin-left:8px; }
  .topbar nav{ display:flex; align-items:center; gap:18px; font-size:13px; }
  .topbar nav a{ color:var(--ink-soft); text-decoration:none; cursor:pointer; }
  .topbar nav a:hover{ color:var(--ink); }
  .who{ color:var(--ink-faint); }
  main{ padding:44px 0 80px; }

  /* ---- buttons / inputs ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:1px solid var(--ink); background:var(--bg); color:var(--ink); cursor:pointer;
    padding:12px 22px; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase;
    transition:background .2s ease, color .2s ease;
  }
  .btn:hover{ background:var(--ink); color:#fff; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn.primary{ background:var(--ink); color:#fff; }
  .btn.primary:hover{ opacity:0.85; background:var(--ink); }
  .btn.danger{ border-color:var(--danger); color:var(--danger); }
  .btn.danger:hover{ background:var(--danger); color:#fff; }
  .btn.small{ padding:7px 14px; font-size:10.5px; }
  .btn.ghost{ border-color:var(--line); color:var(--ink-soft); }
  .btn.ghost:hover{ background:var(--paper); color:var(--ink); }

  label{ display:block; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  input[type=text], input[type=number], input[type=date], input[type=password], input[type=username], textarea, select{
    width:100%; background:var(--paper); border:1px solid var(--line); padding:11px 13px; font-size:14px; color:var(--ink);
  }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--ink); }
  textarea{ resize:vertical; min-height:70px; font-family:inherit; }
  .field{ margin-bottom:18px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
  .checkline{ display:flex; align-items:center; gap:8px; }
  .checkline label{ margin:0; text-transform:none; letter-spacing:0; font-size:13.5px; color:var(--ink); }
  .checkline input{ width:auto; }

  /* ---- login ---- */
  .login-wrap{ max-width:340px; margin:16vh auto 0; padding:0 20px; }
  .login-wrap h1{ font-size:24px; margin-bottom:6px; }
  .login-wrap p.sub{ color:var(--ink-faint); font-size:13.5px; margin-bottom:28px; }
  .error{ background:var(--danger-bg); color:var(--danger); font-size:13px; padding:10px 12px; margin-bottom:16px; border:1px solid #f0d3d1; }

  /* ---- tour list ---- */
  .list-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
  table.tours{ width:100%; border-collapse:collapse; }
  table.tours th{ text-align:left; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); padding:0 12px 10px; border-bottom:1px solid var(--line); }
  table.tours td{ padding:14px 12px; border-bottom:1px solid var(--line-soft); font-size:14px; vertical-align:middle; }
  table.tours tr:hover td{ background:var(--paper); }
  .badge{ display:inline-block; font-size:10px; letter-spacing:0.05em; text-transform:uppercase; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft); }
  .badge.published{ border-color:#bfe0c9; background:#f1faf4; color:var(--ok); }
  .badge.draft{ border-color:var(--line); color:var(--ink-faint); }
  .badge.archived{ border-color:var(--line); color:var(--ink-faint); background:var(--paper); }
  .badge.coming_soon{ border-color:#e0d6b8; background:#fbf7ea; color:#8a6d1f; }
  .row-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .empty{ color:var(--ink-faint); padding:40px 0; text-align:center; }

  /* ---- bookings list ---- */
  .badge.paid{ border-color:#bfe0c9; background:#f1faf4; color:var(--ok); }
  .badge.pending{ border-color:var(--line); color:var(--ink-faint); }
  .badge.failed{ border-color:#f0d3d1; background:var(--danger-bg); color:var(--danger); }
  .badge.canceled{ border-color:var(--line); color:var(--ink-faint); background:var(--paper); }
  .badge.paid_no_capacity{ border-color:var(--danger); background:var(--danger); color:#fff; font-weight:600; }
  tr.needs-attention td{ background:var(--danger-bg); }
  tr.needs-attention:hover td{ background:#f6dedc; }
  .filter-row{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .filter-row label{ margin:0; }
  .filter-row select{ width:auto; min-width:200px; }

  /* ---- editor ---- */
  .editor-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:20px; }
  .editor-head h1{ font-size:24px; }
  section.panel{ border:1px solid var(--line-soft); padding:26px; margin-bottom:22px; }
  section.panel h2{ font-size:15px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line-soft); }
  .repeat-row{ display:grid; gap:10px; border:1px solid var(--line-soft); padding:14px; margin-bottom:10px; position:relative; background:var(--paper); }
  .repeat-row .rm{ position:absolute; top:10px; right:10px; }
  .save-bar{ position:sticky; bottom:0; background:rgba(255,255,255,0.94); backdrop-filter:blur(6px); border-top:1px solid var(--line); padding:16px 0; display:flex; gap:10px; align-items:center; justify-content:flex-end; margin-top:10px; }
  .save-bar .msg{ margin-right:auto; font-size:13px; color:var(--ink-faint); }

  /* ---- gallery ---- */
  .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin-bottom:18px; }
  .gphoto{ border:1px solid var(--line-soft); position:relative; }
  .gphoto img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--paper); }
  .gphoto .gcap{ font-size:11px; padding:7px 8px; color:var(--ink-soft); border-top:1px solid var(--line-soft); }
  .gphoto .gctrl{ position:absolute; top:6px; right:6px; display:flex; gap:4px; }
  .gphoto .gctrl button{ width:24px; height:24px; border:none; background:rgba(10,10,10,0.72); color:#fff; cursor:pointer; font-size:11px; line-height:1; }
  .gphoto .gctrl button:hover{ background:#000; }
  .upload-row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .upload-row .field{ flex:1; min-width:160px; margin-bottom:0; }

  /* ---- editions (dates & capacity) ---- */
  table.editions{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  table.editions th{ text-align:left; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); padding:0 8px 8px; border-bottom:1px solid var(--line); font-weight:500; }
  table.editions td{ padding:8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  table.editions td input[type=text], table.editions td input[type=number], table.editions td input[type=date]{ padding:8px 9px; font-size:13px; }
  table.editions .fa{ font-size:11px; color:var(--ink-faint); margin-top:4px; min-height:14px; }
  table.editions tr.is-past td{ background:var(--paper); }
  table.editions tr.is-past input{ color:var(--ink-faint); }
  .badge.upcoming{ border-color:#bfe0c9; background:#f1faf4; color:var(--ok); }
  .badge.past{ border-color:var(--line); color:var(--ink-faint); background:var(--paper); }
  .badge.undated{ border-color:#e0d6b8; background:#fbf7ea; color:#8a6d1f; }

  /* ---- itinerary stage photos ---- */
  .iphoto-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; margin:4px 0 10px; grid-column:1/-1; }
  .iphoto{ border:1px solid var(--line-soft); position:relative; }
  .iphoto img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--paper); }
  .iphoto button{ position:absolute; top:3px; right:3px; width:20px; height:20px; border:none; background:rgba(10,10,10,0.72); color:#fff; cursor:pointer; font-size:10px; line-height:1; }
  .iphoto button:hover{ background:#000; }
  .istage-photos{ grid-column:1/-1; border-top:1px dashed var(--line-soft); padding-top:12px; margin-top:2px; }
  .istage-photos > label{ margin-bottom:8px; }

  /* ---- hosts (organizers) ---- */
  .host-photo-box{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .host-photo{ width:120px; height:120px; border:1px solid var(--line-soft); background:var(--paper); display:flex; align-items:center; justify-content:center; flex:none; }
  .host-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .host-photo .ph{ font-size:11px; color:var(--ink-faint); text-align:center; padding:6px; }
  .host-photo-ctrl{ flex:1; min-width:200px; }

  /* Assigned organizers inside the tour editor. */
  .th-row{ display:flex; align-items:center; gap:10px; border:1px solid var(--line-soft); padding:10px 12px; margin-bottom:8px; background:var(--paper); }
  .th-row .th-name{ flex:1; font-size:13.5px; }
  .th-row .th-name small{ display:block; color:var(--ink-faint); font-size:11.5px; }
  .th-row select{ width:auto; min-width:120px; }
  .th-row .th-ord{ display:flex; gap:4px; }
  .th-row .th-ord button{ width:26px; height:26px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12px; line-height:1; }
  .th-row .th-ord button:disabled{ opacity:.35; cursor:default; }
  .th-add{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-top:12px; }
  .th-add select{ min-width:220px; width:auto; }

  .app-card{ border:1px solid var(--line-soft); padding:16px 18px; margin-bottom:12px; background:var(--paper); }
  .app-card .app-top{ display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom:8px; }
  .app-card .app-top b{ font-size:14.5px; }
  .app-card .app-meta{ color:var(--ink-faint); font-size:12px; }
  .app-card .app-desc{ font-size:13px; line-height:1.85; color:var(--ink-soft); white-space:pre-wrap; margin:10px 0 12px; }
  .app-actions{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .app-actions .field{ margin-bottom:0; }
  .app-actions input{ width:220px; }

  .badge.active{ background:#e7f2e9; color:#1e6b33; }
  .badge.hidden{ background:#eee; color:#666; }
  .badge.pending{ background:#fdf3e0; color:#8a5a12; }
  .badge.approved{ background:#e7f2e9; color:#1e6b33; }
  .badge.rejected{ background:#fbe9e7; color:#8d2b20; }
  .badge.lead{ background:#ecebff; color:#3b348c; }
  .badge.co_host{ background:#eee; color:#555; }
  .badge.venue{ background:#e6f1f6; color:#1f5771; }
  /* The two partner kinds, told apart at a glance in every list. */
  .badge.person{ background:#f1eee8; color:#6b5a3e; }
  .badge.place{ background:#e6f1f6; color:#1f5771; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:13px;
    border:1px solid var(--line); background:var(--paper); padding:5px 6px 5px 11px;
  }
  .chip-x{
    border:none; background:none; cursor:pointer; font-size:15px; line-height:1;
    color:var(--ink-faint); padding:0 2px;
  }
  .chip-x:hover{ color:var(--danger); }

  .media-row .gm-thumb{ width:64px; height:48px; background:var(--paper); border:1px solid var(--line-soft); overflow:hidden; flex:none; }
  .media-row .gm-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .media-row .gm-caption{ flex:1; padding:8px 10px; border:1px solid var(--line); font:inherit; font-size:13px; }

  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; font-size:13.5px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  #toast.show{ opacity:1; }
  #toast.err{ background:var(--danger); }

  .rev-table td, .rev-table th{ vertical-align:top; }
  .rev-k{ white-space:nowrap; color:var(--ink-faint); }
  .rev-old{ background:#fdf7f6; }
  .rev-new{ background:#f4faf4; }
  .rev-thumbs{ display:flex; flex-wrap:wrap; gap:6px; }
  .rev-thumb, .rev-thumbs .host-photo, .rev-thumbs .ph{ width:64px; height:48px; overflow:hidden; display:inline-block; background:#eee; }
  .rev-thumb img, .rev-thumbs img{ width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // API client
  // ---------------------------------------------------------------------
  async function api(path, opts){
    opts = opts || {};
    const headers = Object.assign({}, opts.headers || {});
    let body = opts.body;
    if (body !== undefined && !(body instanceof FormData)){
      headers['content-type'] = 'application/json';
      body = JSON.stringify(body);
    }
    const res = await fetch('/api' + path, {
      method: opts.method || 'GET',
      headers,
      body,
      credentials: 'same-origin'
    });
    let data = null;
    try { data = await res.json(); } catch(e){ /* no body */ }
    if (!res.ok){
      const err = new Error((data && data.error) || ('http_' + res.status));
      err.status = res.status; err.body = data;
      throw err;
    }
    return data;
  }

  function toast(msg, isErr){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.className = ''; }, 3200);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  const STATUSES = ['draft', 'published', 'coming_soon', 'archived'];
  // Mirrors isValidHostSlug() on the server. The slug is the public URL of a
  // profile (/host/<slug>) and is immutable once created, so it is validated
  // here before the request rather than after a 422.
  const HOST_SLUG_RE = /^[a-z0-9-]{2,40}$/;
  const HOST_STATUSES = ['hidden', 'active'];
  // 'venue' is a place's only role and the only role a place may have; the
  // two people roles are the only ones a person may have. The server
  // enforces this too — these lists just stop the UI offering a 422.
  const HOST_PERSON_ROLES = ['lead', 'co_host'];
  const HOST_KINDS = ['person', 'place'];
  const KIND_LABEL = { person: 'Person', place: 'Place' };
  const TOUR_ID_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
  const PAYMENT_STATUSES = ['pending', 'paid', 'failed', 'canceled', 'paid_no_capacity'];

  // ---------------------------------------------------------------------
  // App state + tiny hash router
  // ---------------------------------------------------------------------
  const state = { admin: null, tours: [], bookings: [], bookingsFilter: '', busy: false,
                  hosts: [], applications: [], applicationsFilter: '', hostsFilter: '',
                  revisionsFilter: 'pending', proposalsFilter: '' };
  const app = document.getElementById('app');

  function route(){
    const hash = location.hash.replace(/^#\/?/, '');
    if (!state.admin){ renderLogin(); return; }
    if (hash === '' || hash === 'tours') { renderList(); return; }
    if (hash === 'tours/new') { renderEditor(null); return; }
    if (hash === 'bookings') { renderBookings(); return; }
    if (hash === 'hosts') { renderHosts(); return; }
    if (hash === 'hosts/new') { renderHostEditor(null, 'person'); return; }
    if (hash === 'hosts/new?kind=place') { renderHostEditor(null, 'place'); return; }
    if (hash === 'applications') { renderApplications(); return; }
    if (hash === 'revisions') { renderRevisions(); return; }
    if (hash === 'proposals') { renderProposals(); return; }
    const mh = /^hosts\/(\d+)\/edit$/.exec(hash);
    if (mh) { renderHostEditor(Number(mh[1])); return; }
    const m = /^tours\/([^/]+)\/edit$/.exec(hash);
    if (m) { renderEditor(m[1]); return; }
    renderList();
  }
  window.addEventListener('hashchange', route);

  async function boot(){
    try {
      const me = await api('/admin/me');
      state.admin = me.admin;
    } catch(e){ state.admin = null; }
    route();
  }

  // ---------------------------------------------------------------------
  // Shell (topbar) — wraps every authenticated view
  // ---------------------------------------------------------------------
  function shell(contentHtml){
    return (
      '<header class="topbar"><div class="topbar-inner">' +
        '<div class="logo"><b>CHAACME</b><span>admin</span></div>' +
        '<nav>' +
          '<a href="#/tours">Tours</a>' +
          '<a href="#/hosts">Organizers</a>' +
          '<a href="#/applications">Applications</a>' +
          '<a href="#/revisions">بازبینی تغییرات</a>' +
          '<a href="#/proposals">پیشنهادهای تجربه</a>' +
          '<a href="#/bookings">رزروها و پرداخت‌ها</a>' +
          '<span class="who">' + esc(state.admin ? state.admin.username : '') + '</span>' +
          '<a id="logoutLink">Log out</a>' +
        '</nav>' +
      '</div></header>' +
      '<main><div class="wrap">' + contentHtml + '</div></main>'
    );
  }

  function bindLogout(){
    const el = document.getElementById('logoutLink');
    if (el) el.addEventListener('click', async function(){
      try { await api('/admin/logout', { method:'POST' }); } catch(e){}
      state.admin = null;
      location.hash = '';
      route();
    });
  }

  // ---------------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------------
  function renderLogin(){
    app.innerHTML =
      '<div class="login-wrap">' +
        '<h1>Admin sign in</h1>' +
        '<p class="sub">CHAACME tour management</p>' +
        '<div id="loginError" class="error" hidden></div>' +
        '<form id="loginForm">' +
          '<div class="field"><label>Username</label><input type="text" id="loginUsername" autocomplete="username" required></div>' +
          '<div class="field"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>' +
          '<button class="btn primary" type="submit" style="width:100%" id="loginSubmit">Sign in</button>' +
        '</form>' +
      '</div>';

    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.hidden = true;
      const btn = document.getElementById('loginSubmit');
      btn.disabled = true;
      try {
        await api('/admin/login', {
          method: 'POST',
          body: {
            username: document.getElementById('loginUsername').value.trim(),
            password: document.getElementById('loginPassword').value
          }
        });
        const me = await api('/admin/me');
        state.admin = me.admin;
        location.hash = '#/tours';
        route();
      } catch(err){
        errEl.textContent = err.status === 429
          ? 'Too many attempts. Wait a few minutes and try again.'
          : 'Incorrect username or password.';
        errEl.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  }

  // ---------------------------------------------------------------------
  // Tour list
  // ---------------------------------------------------------------------
  async function renderList(){
    app.innerHTML = shell('<div class="empty">Loading…</div>');
    bindLogout();
    try {
      const data = await api('/admin/tours');
      state.tours = data.tours;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('Could not load tours', true);
      state.tours = [];
    }

    const rows = state.tours.map(function(t){
      const status = t.status || 'draft';
      return (
        '<tr>' +
          '<td>' + esc(t.name) + '<div style="color:var(--ink-faint);font-size:12px;">' + esc(t.id) + '</div></td>' +
          '<td><span class="badge ' + esc(status) + '">' + esc(status.replace('_',' ')) + '</span></td>' +
          '<td>' + (t.featured ? '★' : '') + '</td>' +
          '<td>' + (t.price != null ? Number(t.price).toLocaleString('en-US') : '—') + '</td>' +
          '<td><div class="row-actions">' +
            '<a class="btn small ghost" href="#/tours/' + encodeURIComponent(t.id) + '/edit">Edit</a>' +
          '</div></td>' +
        '</tr>'
      );
    }).join('');

    app.innerHTML = shell(
      '<div class="list-head"><h1>Tours</h1><a class="btn primary" href="#/tours/new">+ New tour</a></div>' +
      (state.tours.length
        ? '<table class="tours"><thead><tr><th>Name</th><th>Status</th><th>Featured</th><th>Price</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty">No tours yet. Create the first one.</div>')
    );
    bindLogout();
  }

  // ---------------------------------------------------------------------
  // Bookings + payments
  // ---------------------------------------------------------------------
  async function renderBookings(){
    app.innerHTML = shell('<div class="empty">Loading…</div>');
    bindLogout();
    try {
      const qs = state.bookingsFilter ? ('?payment_status=' + encodeURIComponent(state.bookingsFilter)) : '';
      const data = await api('/admin/bookings' + qs);
      state.bookings = data.bookings;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('Could not load bookings', true);
      state.bookings = [];
    }
    paintBookings();
  }

  function paintBookings(){
    const filterOptions = ['<option value="">All payment statuses</option>'].concat(
      PAYMENT_STATUSES.map(function(s){
        return '<option value="' + esc(s) + '"' + (s === state.bookingsFilter ? ' selected' : '') + '>' + esc(s.replace(/_/g, ' ')) + '</option>';
      })
    ).join('');

    const rows = state.bookings.map(function(b){
      const status = b.paymentStatus || 'pending';
      const flagged = status === 'paid_no_capacity';
      const customer = [b.firstName, b.lastName].filter(Boolean).join(' ') || '—';
      return (
        '<tr' + (flagged ? ' class="needs-attention"' : '') + '>' +
          '<td>' + esc(b.ref) + '</td>' +
          '<td>' + esc(b.tourTitle) + '<div style="color:var(--ink-faint);font-size:12px;">' + esc(b.dateLabel) + (b.startsOn ? ' · ' + esc(b.startsOn) : '') + '</div></td>' +
          '<td>' + esc(b.guests) + '</td>' +
          '<td>' + esc(customer) + '<div style="color:var(--ink-faint);font-size:12px;">' + esc(b.phone) + '</div></td>' +
          '<td><span class="badge ' + esc(status) + '">' + (flagged ? '⚠ ' : '') + esc(status.replace(/_/g, ' ')) + '</span></td>' +
          '<td>' + Number(b.total || 0).toLocaleString('en-US') + '</td>' +
          '<td style="font-size:12px;color:var(--ink-faint);">' + esc(b.zarinpalRefId || '—') + '</td>' +
          '<td style="font-size:12px;color:var(--ink-faint);">' + esc(b.createdAt) + '</td>' +
        '</tr>'
      );
    }).join('');

    app.innerHTML = shell(
      '<div class="list-head"><h1>رزروها و پرداخت‌ها</h1></div>' +
      '<div class="filter-row"><label>Payment status</label><select id="bookingsFilter">' + filterOptions + '</select></div>' +
      (state.bookings.length
        ? '<table class="tours"><thead><tr><th>Ref</th><th>Tour / Date</th><th>Guests</th><th>Customer</th><th>Payment</th><th>Amount (Toman)</th><th>ZarinPal ref</th><th>Created</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty">No bookings match this filter.</div>')
    );
    bindLogout();

    document.getElementById('bookingsFilter').addEventListener('change', function(){
      state.bookingsFilter = this.value;
      renderBookings();
    });
  }

  // ---------------------------------------------------------------------
  // Editor — shared for create + edit
  // ---------------------------------------------------------------------
  function emptyTour(){
    return {
      id: '', name: '', status: 'draft', featured: false, ordinal: 0,
      subtitleEn: '', tags: '', duration: '', price: '', description: '', included: '',
      photoPath: '', dayLabel: '', monthLabel: '',
      highlights: [], itinerary: [], reviewCategories: [],
      gallery: [], galleryPhotos: [], galleryMedia: []
    };
  }

  async function renderEditor(id){
    const isNew = !id;
    app.innerHTML = shell('<div class="empty">Loading…</div>');
    bindLogout();

    let tour;
    if (isNew){
      tour = emptyTour();
    } else {
      try {
        const data = await api('/admin/tours/' + encodeURIComponent(id));
        tour = data.tour;
        if (!Array.isArray(tour.galleryMedia)) tour.galleryMedia = [];
        (tour.itinerary || []).forEach(function(it){ if (!Array.isArray(it.photos)) it.photos = []; });
      } catch(e){
        if (e.status === 401){ state.admin = null; renderLogin(); return; }
        toast('Could not load tour', true);
        location.hash = '#/tours';
        return;
      }
    }

    const ed = { tour: tour, isNew: isNew };
    paintEditor(ed);
  }

  function paintEditor(ed){
    const t = ed.tour;
    const idField = ed.isNew
      ? '<div class="field"><label>Tour ID (permanent, url-safe: lowercase letters, digits, hyphens)</label>' +
        '<input type="text" id="f_id" value="' + esc(t.id) + '" placeholder="e.g. desert-parthian"></div>'
      : '<div class="field"><label>Tour ID</label><input type="text" value="' + esc(t.id) + '" disabled></div>';

    app.innerHTML = shell(
      '<div class="editor-head">' +
        '<h1>' + (ed.isNew ? 'New tour' : esc(t.name || t.id)) + '</h1>' +
        (ed.isNew ? '' : '<button class="btn danger small" id="deleteTourBtn">Delete tour</button>') +
      '</div>' +

      '<section class="panel"><h2>Basics</h2>' +
        '<div class="grid2">' +
          idField +
          field('Name', 'f_name', t.name) +
        '</div>' +
        '<div class="grid3">' +
          selectField('Status', 'f_status', STATUSES, t.status || 'draft') +
          field('Duration', 'f_duration', t.duration, 'e.g. یک‌روزه') +
          field('Price (Toman)', 'f_price', t.price, '', 'number') +
        '</div>' +
        '<div class="grid2">' +
          field('Tags', 'f_tags', t.tags, 'comma or · separated, shown as-is') +
          field('Subtitle (EN)', 'f_subtitleEn', t.subtitleEn) +
        '</div>' +
        '<div class="grid2">' +
          field('Card day label', 'f_dayLabel', t.dayLabel, 'e.g. ۱ — required for Featured to show on homepage') +
          field('Card month label', 'f_monthLabel', t.monthLabel, 'e.g. مهر') +
        '</div>' +
        '<div class="field"><label>Cover photo path</label>' +
          uploadRow('cover', t.photoPath, t.id) +
        '</div>' +
        '<div class="field checkline"><input type="checkbox" id="f_featured"' + (t.featured ? ' checked' : '') + '>' +
          '<label for="f_featured">Featured (shown on the homepage — also needs Card day/month label above, or it won’t appear there)</label></div>' +
        '<div class="field"><label>Description</label><textarea id="f_description">' + esc(t.description) + '</textarea></div>' +
        '<div class="field"><label>What\'s included</label><textarea id="f_included">' + esc(t.included) + '</textarea></div>' +
      '</section>' +

      '<section class="panel"><h2>Highlights</h2>' +
        '<div id="highlightsList"></div>' +
        '<button class="btn small ghost" id="addHighlight">+ Add highlight</button>' +
      '</section>' +

      '<section class="panel"><h2>Itinerary</h2>' +
        '<div id="itineraryList"></div>' +
        '<button class="btn small ghost" id="addStep">+ Add step</button>' +
      '</section>' +

      '<section class="panel"><h2>Review categories</h2>' +
        '<div id="categoriesList"></div>' +
        '<button class="btn small ghost" id="addCategory">+ Add category</button>' +
      '</section>' +

      '<section class="panel" id="galleryPanel"><h2>Gallery</h2>' +
        (ed.isNew
          ? '<p style="color:var(--ink-faint);font-size:13px;margin-bottom:14px;">Save the tour first, then manage its gallery here.</p>'
          : renderGallerySection(t)) +
      '</section>' +

      // Saved per row through its own endpoints (POST/PUT /admin/tours/:id/dates,
      // /admin/tour-dates/:id), like Partners, so it has its own buttons.
      '<section class="panel" id="editionsPanel"><h2>Dates &amp; capacity</h2>' +
        (ed.isNew
          ? '<p style="color:var(--ink-faint);font-size:13px;">Save the tour first, then add its dates here.</p>'
          : '<div class="empty">Loading…</div>') +
      '</section>' +

      // Saved through its own endpoint (PUT /admin/tours/:id/hosts), so it has
      // its own save button rather than riding along with the tour fields.
      '<section class="panel" id="tourHostsPanel"><h2>Partners</h2>' +
        (ed.isNew
          ? '<p style="color:var(--ink-faint);font-size:13px;">Save the tour first, then assign its organizers here.</p>'

      '</section>' +

    bindLogout();

    if (!ed.isNew) { initTourHosts(ed.tour.id); initEditions(ed.tour.id); }

    renderRepeat('highlightsList', ed.tour.highlights, [
      { key:'name', label:'Name' }, { key:'description', label:'Description', area:true }
    ]);

      { key:'label', label:'Label' }, { key:'score', label:'Score (0-5)', number:true }
    ]);

    document.getElementById('addHighlight').addEventListener('click', function(){
      ed.tour.highlights.push({ name:'', description:'' });
      renderRepeat('highlightsList', ed.tour.highlights, [
        { key:'name', label:'Name' }, { key:'description', label:'Description', area:true }
      ]);
    });
    document.getElementById('addStep').addEventListener('click', function(){
      ed.tour.itinerary.push({ time:'', title:'', description:'', photoLabel:'', photoPath:'', photos:[] });
      renderItineraryList(ed);
    });
    document.getElementById('addCategory').addEventListener('click', function(){
      ed.tour.reviewCategories.push({ label:'', score:'' });
      renderRepeat('categoriesList', ed.tour.reviewCategories, [
        { key:'label', label:'Label' }, { key:'score', label:'Score (0-5)', number:true }
      ]);
    });

    bindCoverUpload(ed);
    if (!ed.isNew) bindGallery(ed);

    var delBtn = document.getElementById('deleteTourBtn');
    if (delBtn) delBtn.addEventListener('click', function(){ deleteTour(ed); });

    document.getElementById('saveBtn').addEventListener('click', function(){ saveTour(ed); });

  function field(label, id, value, placeholder, type){
    return '<div class="field"><label>' + esc(label) + '</label>' +
      '<input type="' + (type || 'text') + '" id="' + id + '" value="' + esc(value == null ? '' : value) + '"' +
      (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '></div>';
  }
  function selectField(label, id, options, current){
    return '<div class="field"><label>' + esc(label) + '</label><select id="' + id + '">' +
      options.map(function(o){
        return '<option value="' + esc(o) + '"' + (o === current ? ' selected' : '') + '>' + esc(o.replace('_',' ')) + '</option>';
      }).join('') + '</select></div>';
  }

  function uploadRow(prefix, currentPath, tourId){
    return '<div class="upload-row">' +
      '<div class="field"><input type="text" id="' + prefix + 'Path" value="' + esc(currentPath || '') + '" placeholder="/images/…"></div>' +
      '<input type="file" id="' + prefix + 'File" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
      '<button type="button" class="btn small ghost" id="' + prefix + 'Upload" data-tourid="' + esc(tourId || '') + '">Upload</button>' +
    '</div>';
  }

  function bindCoverUpload(ed){
    const btn = document.getElementById('coverUpload');
    btn.addEventListener('click', async function(){
      const fileInput = document.getElementById('coverFile');
      if (!fileInput.files[0]){ toast('Choose a file first', true); return; }
      btn.disabled = true;
      try {
        const path = await uploadFile(fileInput.files[0], document.getElementById('f_id') ? document.getElementById('f_id').value.trim() : ed.tour.id);
        document.getElementById('coverPath').value = path;
        toast('Cover photo uploaded');
      } catch(e){
        toast('Upload failed: ' + (e.body && e.body.error || e.message), true);
      } finally { btn.disabled = false; }
    });
  }

  async function uploadFile(file, tourId){
    const fd = new FormData();
    fd.append('file', file);
    if (tourId) fd.append('tourId', tourId);
    const data = await api('/admin/upload', { method:'POST', body: fd });
    return data.path;
  }

  // ---- generic repeatable list (highlights / itinerary / review categories) ----
  function renderRepeat(containerId, items, fields){
    const el = document.getElementById(containerId);
    if (!items.length){
      el.innerHTML = '<p style="color:var(--ink-faint);font-size:13px;">None yet.</p>';
      return;
    }
    el.innerHTML = items.map(function(item, i){
      const cols = fields.map(function(f){
        const val = item[f.key] == null ? '' : item[f.key];
        const inputHtml = f.area
          ? '<textarea data-i="' + i + '" data-k="' + f.key + '" style="min-height:50px;">' + esc(val) + '</textarea>'
          : '<input type="' + (f.number ? 'number' : 'text') + '" ' + (f.number ? 'step="0.1"' : '') +
            ' data-i="' + i + '" data-k="' + f.key + '" value="' + esc(val) + '">';
        return '<div class="field" style="margin-bottom:0;"><label>' + esc(f.label) + '</label>' + inputHtml + '</div>';
      }).join('');
      return '<div class="repeat-row" style="grid-template-columns:repeat(' + Math.min(fields.length,3) + ',1fr);">' +
        cols + '<button type="button" class="btn small ghost rm" data-i="' + i + '">✕</button></div>';
    }).join('');

    el.querySelectorAll('input, textarea').forEach(function(inp){
      inp.addEventListener('input', function(){
        const i = Number(inp.dataset.i), k = inp.dataset.k;
        items[i][k] = inp.type === 'number' ? (inp.value === '' ? null : Number(inp.value)) : inp.value;
      });
    });
    el.querySelectorAll('.rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        items.splice(Number(btn.dataset.i), 1);
        renderRepeat(containerId, items, fields);
      });
    });
  }

  // ---- itinerary (own renderer, not the generic renderRepeat: each stage
  // also carries a multi-photo array using the same /admin/upload endpoint
  // and magic-byte/5MB validation as the gallery, just without gallery's
  // per-photo stable ids — the whole itinerary array is bulk-replaced on
  // Save, same as its other fields, so photo removal only needs to edit
  // local state and let Save persist it. ----
  const ITINERARY_FIELDS = [
    { key:'time', label:'Time label' }, { key:'title', label:'Title' },
    { key:'description', label:'Description', area:true },
    { key:'photoLabel', label:'Photo label' }
  ];

  function renderItineraryList(ed){
    const el = document.getElementById('itineraryList');
    const items = ed.tour.itinerary;
    if (!items.length){
      el.innerHTML = '<p style="color:var(--ink-faint);font-size:13px;">None yet.</p>';
      return;
    }
    el.innerHTML = items.map(function(item, i){
      const cols = ITINERARY_FIELDS.map(function(f){
        const val = item[f.key] == null ? '' : item[f.key];
        const inputHtml = f.area
          ? '<textarea data-i="' + i + '" data-k="' + f.key + '" style="min-height:50px;">' + esc(val) + '</textarea>'
          : '<input type="text" data-i="' + i + '" data-k="' + f.key + '" value="' + esc(val) + '">';
        return '<div class="field" style="margin-bottom:0;"><label>' + esc(f.label) + '</label>' + inputHtml + '</div>';
      }).join('');
      const photos = (item.photos || []).map(function(path, pi){
        return '<div class="iphoto" data-si="' + i + '" data-pi="' + pi + '">' +
          '<img src="' + esc(path) + '" onerror="this.style.opacity=0.15" alt="">' +
          '<button type="button" class="iPhotoDel" title="Remove">✕</button>' +
        '</div>';
      }).join('');
      const photoBlock = '<div class="istage-photos">' +
        '<label>Photos</label>' +
        '<div class="iphoto-grid">' + photos + '</div>' +
        '<div class="upload-row">' +
          '<input type="file" class="iPhotoFile" data-i="' + i + '" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
          '<button type="button" class="btn small ghost iPhotoAdd" data-i="' + i + '">Add photo</button>' +
        '</div>' +
      '</div>';
      return '<div class="repeat-row" style="grid-template-columns:repeat(' + Math.min(ITINERARY_FIELDS.length,3) + ',1fr);">' +
        cols + photoBlock + '<button type="button" class="btn small ghost rm" data-i="' + i + '">✕</button></div>';
    }).join('');

    el.querySelectorAll('input[data-k], textarea[data-k]').forEach(function(inp){
      inp.addEventListener('input', function(){
        const i = Number(inp.dataset.i), k = inp.dataset.k;
        items[i][k] = inp.value;
      });
    });
    el.querySelectorAll('.rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        items.splice(Number(btn.dataset.i), 1);
        renderItineraryList(ed);
      });
    });
    el.querySelectorAll('.iPhotoDel').forEach(function(btn){
      btn.addEventListener('click', function(){
        const cell = btn.closest('.iphoto');
        const si = Number(cell.dataset.si), pi = Number(cell.dataset.pi);
        items[si].photos.splice(pi, 1);
        renderItineraryList(ed);
      });
    });
    el.querySelectorAll('.iPhotoAdd').forEach(function(btn){
      btn.addEventListener('click', async function(){
        const i = Number(btn.dataset.i);
        const fileInput = el.querySelector('.iPhotoFile[data-i="' + i + '"]');
        if (!fileInput.files[0]){ toast('Choose a file first', true); return; }
        btn.disabled = true;
        try {
          const tourId = document.getElementById('f_id') ? document.getElementById('f_id').value.trim() : ed.tour.id;
          const path = await uploadFile(fileInput.files[0], tourId);
          items[i].photos.push(path);
          renderItineraryList(ed);
          toast('Photo uploaded — click Save changes to attach it to this stage');
        } catch(e){
          toast('Upload failed: ' + (e.body && e.body.error || e.message), true);
        } finally { btn.disabled = false; }
      });
    });
  }

  // ---- gallery (edit mode only — needs real tour_media ids) ----
  function renderGallerySection(t){
    const photos = (t.galleryMedia || []).map(function(m, i){
      return '<div class="gphoto" data-id="' + m.id + '">' +
        '<img src="' + esc(m.photoPath || '') + '" onerror="this.style.opacity=0.15" alt="">' +
        '<div class="gctrl">' +
          (i > 0 ? '<button type="button" class="gUp" title="Move earlier">↑</button>' : '') +
          (i < t.galleryMedia.length - 1 ? '<button type="button" class="gDown" title="Move later">↓</button>' : '') +
          '<button type="button" class="gDel" title="Delete">✕</button>' +
        '</div>' +
        '<div class="gcap">' + esc(m.label || '(no label)') + '</div>' +
      '</div>';
    }).join('');

    return '<div class="gallery-grid" id="galleryGrid">' + (photos || '<p style="color:var(--ink-faint);font-size:13px;">No photos yet.</p>') + '</div>' +
      '<div class="upload-row">' +
        '<div class="field"><label>New photo label</label><input type="text" id="newPhotoLabel" placeholder="e.g. Sunrise departure"></div>' +
        '<input type="file" id="newPhotoFile" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
        '<button type="button" class="btn small primary" id="addPhotoBtn">Add photo</button>' +
      '</div>';
  }

  function bindGallery(ed){
    const grid = document.getElementById('galleryGrid');
    grid.querySelectorAll('.gDel').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = Number(btn.closest('.gphoto').dataset.id);
        deleteGalleryPhoto(ed, id);
      });
    });
    grid.querySelectorAll('.gUp').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = Number(btn.closest('.gphoto').dataset.id);
        moveGalleryPhoto(ed, id, -1);
      });
    });
    grid.querySelectorAll('.gDown').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = Number(btn.closest('.gphoto').dataset.id);
        moveGalleryPhoto(ed, id, 1);
      });
    });
    document.getElementById('addPhotoBtn').addEventListener('click', function(){ addGalleryPhoto(ed); });
  }

  async function deleteGalleryPhoto(ed, mediaId){
    if (!confirm('Delete this photo? This cannot be undone.')) return;
    try {
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id) + '/gallery/' + mediaId, { method:'DELETE' });
      toast('Photo deleted');
      await refreshGalleryFull(ed);
    } catch(e){ toast('Delete failed', true); }
  }

  async function moveGalleryPhoto(ed, mediaId, dir){
    const ids = ed.tour.galleryMedia.map(function(m){ return m.id; });
    const i = ids.indexOf(mediaId);
    const j = i + dir;
    if (j < 0 || j >= ids.length) return;
    const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    try {
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id) + '/gallery/reorder', { method:'PUT', body:{ order: ids } });
      await refreshGalleryFull(ed);
    } catch(e){ toast('Reorder failed', true); }
  }

  async function addGalleryPhoto(ed){
    const fileInput = document.getElementById('newPhotoFile');
    const label = document.getElementById('newPhotoLabel').value.trim();
    if (!fileInput.files[0]){ toast('Choose a file first', true); return; }
    const btn = document.getElementById('addPhotoBtn');
    btn.disabled = true;
    try {
      const path = await uploadFile(fileInput.files[0], ed.tour.id);
      const galleryImages = ed.tour.gallery.concat([label]);
      const galleryPhotos = ed.tour.galleryPhotos.concat([path]);
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id), {
        method:'PUT', body:{ galleryImages: galleryImages, galleryPhotos: galleryPhotos }
      });
      toast('Photo added');
      await refreshGalleryFull(ed);
    } catch(e){
      toast('Upload/save failed', true);
    } finally { btn.disabled = false; }
  }

  // Re-fetches the tour and repaints just the gallery <section> in place.
  async function refreshGalleryFull(ed){
    const data = await api('/admin/tours/' + encodeURIComponent(ed.tour.id));
    ed.tour = Object.assign(ed.tour, data.tour);
    document.getElementById('galleryPanel').innerHTML = '<h2>Gallery</h2>' + renderGallerySection(ed.tour);
    bindGallery(ed);
  }


  // ---------------------------------------------------------------------
  // Editions: dates + capacity (one row per bookable run of a tour)
  // ---------------------------------------------------------------------
  const PHASE_LABEL = { upcoming: 'Upcoming', past: 'Finished', undated: 'No date set' };
  const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;

  // Shows the Jalali equivalent of the Gregorian date the <input type=date>
  // holds, so an admin can sanity-check "۱۲ مهر ۱۴۰۵" against the label.
  function faDate(iso){
    if (!ISO_RE.test(iso || '')) return '';
    try {
      return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { dateStyle: 'long', timeZone: 'UTC' })
        .format(new Date(iso + 'T00:00:00Z'));
    } catch(e){ return ''; }
  }

  function editionRow(d){
    const isNew = d.id == null;
    const phase = d.phase || 'undated';
    return '<tr data-id="' + (isNew ? '' : d.id) + '" class="' + (phase === 'past' ? 'is-past' : '') + '">' +
      '<td><input type="text" class="e_label" dir="auto" value="' + esc(d.label) + '" placeholder="۱۲ مهر"></td>' +
      '<td><input type="date" class="e_start" value="' + esc(d.startsOn || '') + '"><div class="fa e_start_fa">' + esc(faDate(d.startsOn)) + '</div></td>' +
      '<td><input type="date" class="e_end" value="' + esc(d.endsOn || '') + '"><div class="fa e_end_fa">' + esc(faDate(d.endsOn)) + '</div></td>' +
      '<td><input type="number" class="e_cap" min="0" step="1" value="' + esc(d.capacity == null ? '' : d.capacity) + '" style="width:80px"></td>' +

        'Dates are Gregorian (the Jalali date appears underneath). Once an edition\'s last day has passed it is shown as finished and can no longer be booked. ' +
        'Editions with no date set stay bookable until you set one. Leave <em>Ends</em> empty for a single-day edition.' +
      '</p>' +
      '<table class="editions"><thead><tr><th>Label</th><th>Starts</th><th>Ends</th><th>Capacity</th><th>Booked</th><th>Closed</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      inp.addEventListener('input', function(){

  async function initEditions(tourId){
    try { await loadEditions(tourId); }
    catch(e){
      const panel = document.getElementById('editionsPanel');
      if (panel) panel.innerHTML = '<h2>Dates &amp; capacity</h2><div class="empty">Could not load dates.</div>';
    }
  }

  async function saveEdition(tourId, tr, btn){
    const q = function(sel){ return tr.querySelector(sel); };
    const id = tr.getAttribute('data-id');
    const label = q('.e_label').value.trim();
    const capRaw = q('.e_cap').value.trim();
    const capacity = capRaw === '' ? NaN : Number(capRaw);
    const startsOn = q('.e_start').value || null;
    const endsOn = q('.e_end').value || null;

    if (!label) { toast('Label is required', true); return; }
    if (!Number.isInteger(capacity) || capacity < 0) { toast('Capacity must be a whole number, 0 or more', true); return; }
    if (endsOn && !startsOn) { toast('Set a start date before an end date', true); return; }
    if (startsOn && endsOn && endsOn < startsOn) { toast('End date is before the start date', true); return; }

    btn.disabled = true;
    try {
      if (id) {
        await api('/admin/tour-dates/' + id, { method: 'PUT',
          body: { label: label, capacity: capacity, startsOn: startsOn, endsOn: endsOn, closed: q('.e_closed').checked } });
      } else {
        const body = { label: label, capacity: capacity };
        if (startsOn) body.startsOn = startsOn;
        if (endsOn) body.endsOn = endsOn;
        await api('/admin/tours/' + encodeURIComponent(tourId) + '/dates', { method: 'POST', body: body });
      }
      toast(id ? 'Date saved' : 'Date added');
      await loadEditions(tourId);
    } catch(e){
      const f = e.body && e.body.fields;
      toast(f ? 'Invalid date: ' + Object.keys(f).join(', ') : 'Could not save date (' + e.message + ')', true);
      btn.disabled = false;
    }
  }

  // ---------------------------------------------------------------------
  // Save / delete
  // ---------------------------------------------------------------------
  function readEditorFields(ed){
    const t = ed.tour;
    const patch = {
      name: val('f_name'), status: val('f_status'), duration: val('f_duration'),
      price: numOrNull('f_price'), tags: val('f_tags'), subtitleEn: val('f_subtitleEn'),
      dayLabel: val('f_dayLabel'), monthLabel: val('f_monthLabel'),
      photoPath: val('coverPath'), featured: document.getElementById('f_featured').checked,
      description: val('f_description'), included: val('f_included'),
      highlights: t.highlights.filter(function(h){ return h.name; }),
      itinerary: t.itinerary.filter(function(s){ return s.title; }),
      reviewCategories: t.reviewCategories.filter(function(c){ return c.label; })
    };
    if (ed.isNew){
      patch.galleryImages = t.gallery || [];
      patch.galleryPhotos = t.galleryPhotos || [];
    }
    return patch;
  }
  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function numOrNull(id){ const v = val(id); return v === '' ? null : Number(v); }

  async function saveTour(ed){
    const msg = document.getElementById('editorMsg');
    const btn = document.getElementById('saveBtn');
    msg.textContent = '';

    if (ed.isNew){
      const id = val('f_id');
      if (!TOUR_ID_RE.test(id)){
        msg.textContent = 'Tour ID must be lowercase letters/digits/hyphens only (e.g. desert-parthian).';
        return;
      }
      ed.tour.id = id;
    }
    const patch = readEditorFields(ed);
    if (!patch.name){ msg.textContent = 'Name is required.'; return; }

    const featuredWithoutDate = patch.featured && (!patch.dayLabel || !patch.monthLabel);
    const savedMsg = featuredWithoutDate
      ? 'Saved — but Featured tours need both Card day and month label to actually show on the homepage.'
      : null;

    btn.disabled = true;
    try {
      if (ed.isNew){
        patch.id = ed.tour.id;
        await api('/admin/tours', { method:'POST', body: patch });
        toast(savedMsg || 'Tour created', featuredWithoutDate);
        location.hash = '#/tours/' + encodeURIComponent(ed.tour.id) + '/edit';
        route();
      } else {
        await api('/admin/tours/' + encodeURIComponent(ed.tour.id), { method:'PUT', body: patch });
        toast(savedMsg || 'Saved', featuredWithoutDate);
        renderEditor(ed.tour.id);
      }
    } catch(e){
      if (e.status === 409) msg.textContent = 'That tour ID is already taken.';
      else if (e.status === 422) msg.textContent = 'Please check the highlighted fields.';
      else msg.textContent = 'Save failed. Try again.';
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteTour(ed){
    if (!confirm('Delete "' + ed.tour.name + '"? This cannot be undone.')) return;
    try {
      await api('/admin/tours/' + encodeURIComponent(ed.tour.id), { method:'DELETE' });
      toast('Tour deleted');
      location.hash = '#/tours';
      route();
    } catch(e){
      if (e.status === 409) toast('Cannot delete: this tour has real bookings. Archive it instead.', true);
      else toast('Delete failed', true);
    }
  }

      (shown.length

        'Up to 20, each up to 40 characters. Saved with the rest of the profile.</p>' +
    '</section>';
  }

  function locationPanelHtml(host){
    return '<section class="panel"><h2>Location</h2>' +
      '<div class="field" style="display:inline-block;width:48%;margin-inline-end:2%;"><label>Latitude</label>' +
        '<input type="text" id="h_lat" dir="ltr" value="' + esc(host.latitude == null ? '' : host.latitude) + '" placeholder="36.812"></div>' +
      '<div class="field" style="display:inline-block;width:48%;"><label>Longitude</label>' +
        '<input type="text" id="h_lng" dir="ltr" value="' + esc(host.longitude == null ? '' : host.longitude) + '" placeholder="50.898"></div>' +
      '<p style="color:var(--ink-faint);font-size:12px;">' +
        'Enter the real point — it is kept for you, not published. The public page only ever shows it ' +
        '<b>rounded to 2 decimals (~1 km)</b> as a map area, never an exact pin or an address. ' +
        'Both fields together or both empty; must be inside Iran.</p>' +
    '</section>';
  }

  function drawAmenities(ed){
    const box = document.getElementById('h_amenityChips');
    if (!box) return;
    box.innerHTML = ed.amenities.length
      ? ed.amenities.map(function(a, i){
          return '<span class="chip">' + esc(a) + '<button type="button" class="chip-x" data-i="' + i + '" title="Remove">×</button></span>';
        }).join('')
      : '<span style="color:var(--ink-faint);font-size:13px;">None yet.</span>';
    box.querySelectorAll('.chip-x').forEach(function(btn){
      btn.addEventListener('click', function(){
        ed.amenities.splice(Number(btn.dataset.i), 1);
        drawAmenities(ed);
      });
    });
  }

  function bindAmenities(ed){
    drawAmenities(ed);
    const input = document.getElementById('h_amenityInput');
    const addIt = function(){
      const v = (input.value || '').trim();
      if (!v) return;
      if (ed.amenities.length >= 20){ toast('20 amenities is the limit', true); return; }
      if (ed.amenities.indexOf(v) !== -1){ toast('Already listed', true); input.value = ''; return; }
      ed.amenities.push(v);
      input.value = '';
      drawAmenities(ed);
    };
    document.getElementById('h_amenityAdd').addEventListener('click', addIt);
    input.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){ ev.preventDefault(); addIt(); }
    });
  }

  // ---- gallery (host_media) -------------------------------------------
  // Saved on its own button, not with the profile: the endpoint replaces the
  // whole list in one transaction, so a half-built gallery must never be sent.
  function drawHostMedia(ed){
    const panel = document.getElementById('hostMediaPanel');
    if (!panel) return;
    const rows = ed.media.map(function(m, i){
      return '<div class="th-row media-row" data-i="' + i + '">' +
        '<div class="th-ord">' +
          '<button type="button" class="gm-up"' + (i === 0 ? ' disabled' : '') + ' title="Move up">↑</button>' +
          '<button type="button" class="gm-down"' + (i === ed.media.length - 1 ? ' disabled' : '') + ' title="Move down">↓</button>' +
        '</div>' +
        '<div class="gm-thumb"><img src="' + esc(m.photoPath) + '" alt=""></div>' +
        '<input type="text" class="gm-caption" maxlength="120" placeholder="Caption (optional)" value="' + esc(m.caption || '') + '">' +
        '<button type="button" class="btn small danger gm-rm">Remove</button>' +
      '</div>';
    }).join('');

    panel.innerHTML =
      '<h2>Gallery</h2>' +
      (ed.media.length ? rows : '<p style="color:var(--ink-faint);font-size:13px;">No images yet.</p>') +
      '<div class="th-add">' +
        '<input type="file" id="gmFile" accept="image/png,image/jpeg,image/webp" style="max-width:220px;">' +
        '<button type="button" class="btn small ghost" id="gmAdd">+ Upload</button>' +
        '<button type="button" class="btn small primary" id="gmSave">Save gallery</button>' +
        '<span class="msg" id="gmMsg" style="font-size:13px;color:var(--ink-faint);"></span>' +
      '</div>' +
      '<p style="color:var(--ink-faint);font-size:12px;margin-top:12px;">' +
        'Shown on the public profile in this order. Uploading adds an image immediately; ' +
        '<b>Save gallery</b> is what stores the list, its order and its captions.</p>';

    panel.querySelectorAll('.gm-rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        ed.media.splice(Number(btn.closest('.media-row').dataset.i), 1);
        drawHostMedia(ed);
      });
    });
    panel.querySelectorAll('.gm-up').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.media-row').dataset.i);
        ed.media.splice(i - 1, 0, ed.media.splice(i, 1)[0]);
        drawHostMedia(ed);
      });
    });
    panel.querySelectorAll('.gm-down').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = Number(btn.closest('.media-row').dataset.i);
        ed.media.splice(i + 1, 0, ed.media.splice(i, 1)[0]);
        drawHostMedia(ed);
      });
    });
    panel.querySelectorAll('.gm-caption').forEach(function(input){
      input.addEventListener('input', function(){
        ed.media[Number(input.closest('.media-row').dataset.i)].caption = input.value;
      });
    });

    document.getElementById('gmAdd').addEventListener('click', async function(){
      const f = document.getElementById('gmFile');
      if (!f.files || !f.files[0]) { toast('Choose an image first', true); return; }
      this.disabled = true;
      try {
        const data = await uploadHostImage(ed, f.files[0]);
        ed.media.push({ photoPath: data.path, caption: '' });
        drawHostMedia(ed);
        toast('Uploaded — remember to save the gallery');
      } catch(e){
        toast(e.status === 422 ? 'That file was rejected (png/jpeg/webp only)' : 'Upload failed', true);
        this.disabled = false;
      }
    });

    document.getElementById('gmSave').addEventListener('click', async function(){
      const msg = document.getElementById('gmMsg');
      msg.textContent = '';
      this.disabled = true;
      try {
        await api('/admin/hosts/' + ed.host.id + '/media', { method:'PUT', body: { media: ed.media } });
        toast('Gallery saved');
      } catch(e){
        if (e.status === 401){ state.admin = null; renderLogin(); return; }
        msg.textContent = e.status === 422 ? 'One of these images was rejected. Re-upload it.' : 'Could not save the gallery.';
      } finally { this.disabled = false; }
    });
  }

  function splitTags(text){
    return String(text || '').split(/[,،\n]/).map(function(t){ return t.trim(); }).filter(Boolean);
  }

  function hostPatchFromForm(ed){
    const patch = {
      kind: ed.host.kind,
      displayName: (document.getElementById('h_name').value || '').trim(),
      bio: (document.getElementById('h_bio').value || '').trim(),
      instagramHandle: (document.getElementById('h_instagram').value || '').trim(),
      contactPhone: (document.getElementById('h_phone').value || '').trim(),
      photoPath: ed.photoPath || '',
      status: document.getElementById('h_status').value,
      verified: document.getElementById('h_verified').checked
    };
    if (ed.isPlace){
      patch.region = (document.getElementById('h_region').value || '').trim();
      patch.lodgingType = (document.getElementById('h_lodging').value || '').trim();
      patch.amenities = ed.amenities;
      // Sent as-is (empty string included): the server treats "" as absent,
      // and a half-filled pair is a 422 rather than a guess at the other half.
      patch.latitude = (document.getElementById('h_lat').value || '').trim();
      patch.longitude = (document.getElementById('h_lng').value || '').trim();
      patch.capacityGuests = (document.getElementById('h_capacity').value || '').trim();
      patch.houseRules = (document.getElementById('h_rules').value || '').trim();
      patch.acceptsExperienceTypes = splitTags(document.getElementById('h_accepts').value);
    } else {
      patch.expertise = (document.getElementById('h_expertise').value || '').trim();
      patch.credentials = (document.getElementById('h_credentials').value || '').trim();
      patch.seekingPlaceTypes = splitTags(document.getElementById('h_seeking').value);
    }
    return patch;
  }

  // Maps the server's per-field 422 codes onto the field they belong to, so a
  // rejected save says which input is wrong instead of "check the fields".
  const HOST_FIELD_MSG = {
    displayName: 'Name is required (max 80 characters).',
    bio: 'Bio/description is too long (max 1500 characters).',
    expertise: 'Expertise is too long (max 120 characters).',
    region: 'Region is too long (max 120 characters).',
    lodgingType: 'Lodging type is too long (max 60 characters).',
    amenities: 'Amenities must be at most 20 items of at most 40 characters each.',
    latitude: 'Latitude must be a number inside Iran (roughly 24–40).',
    longitude: 'Longitude must be a number inside Iran (roughly 43–64).',
    coordinates: 'Give both latitude and longitude, or neither.',
    instagramHandle: 'Instagram handle is not valid — username only, no @ or link.',
    contactPhone: 'Contact phone is not a valid Iranian mobile number.',
    photoPath: 'Photo path is not one of our uploads. Re-upload the image.',
    credentials: 'Credentials are too long (max 600 characters).',
    capacityGuests: 'Capacity must be a whole number from 1 to 500.',
    houseRules: 'House rules are too long (max 1000 characters).',
    seekingPlaceTypes: 'Seeking types: at most 10 items of at most 40 characters.',
    acceptsExperienceTypes: 'Accepted types: at most 10 items of at most 40 characters.',
    status: 'Status must be hidden or active.',
    slug: 'Slug must be 2–40 lowercase letters, digits or hyphens.'
  };

  function hostErrorText(e){
    if (e.status === 409) return 'That slug is already taken.';
    if (e.status === 422 && e.body && e.body.fields){
      const msgs = Object.keys(e.body.fields).map(function(f){ return HOST_FIELD_MSG[f] || (f + ' is invalid.'); });
      if (msgs.length) return msgs.join(' ');
    }
    return 'Save failed. Try again.';
  }

  async function saveHost(ed){
    const msg = document.getElementById('hostMsg');
    const btn = document.getElementById('hostSaveBtn');
    msg.textContent = '';

    const patch = hostPatchFromForm(ed);
    if (!patch.displayName){ msg.textContent = 'Name is required.'; return; }
    if (ed.isPlace && !patch.region){ msg.textContent = 'A place needs a region.'; return; }

    let slug = ed.host.slug;
    if (ed.isNew){
      slug = (document.getElementById('h_slug').value || '').trim();
      if (!HOST_SLUG_RE.test(slug)){
        msg.textContent = 'Slug must be 2–40 lowercase letters, digits or hyphens (e.g. arash-niko).';
        return;
      }
    }

    btn.disabled = true;
    try {
      if (ed.isNew){
        const created = await api('/admin/hosts', { method:'POST', body: Object.assign({ slug: slug }, patch) });
        toast('Profile created');
        location.hash = '#/hosts/' + created.host.id + '/edit';
        route();
      } else {
        await api('/admin/hosts/' + ed.host.id, { method:'PUT', body: patch });
        toast('Saved');
        renderHostEditor(ed.host.id);
      }
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      msg.textContent = hostErrorText(e);
    } finally {
      btn.disabled = false;
    }
  }

  // ---------------------------------------------------------------------
  // Applications ("become an organizer" submissions)
  // ---------------------------------------------------------------------
  function slugSuggestion(fullName){
    // Latin names give a usable slug; Persian ones do not, so leave it blank
    // rather than emit an empty or mangled one the admin might not notice.
    const s = String(fullName || '').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return HOST_SLUG_RE.test(s) ? s : '';
  }

          (pending

  async function approveApplication(id, slug, btn){
    if (!HOST_SLUG_RE.test(slug)){
      toast('Slug must be 2–40 lowercase letters, digits or hyphens', true);
      return;
    }
    btn.disabled = true;
    try {
      const data = await api('/admin/host-applications/' + id + '/approve', { method:'POST', body: { slug: slug } });
      toast('Approved — complete the profile, then set it to active');
      location.hash = '#/hosts/' + data.host.id + '/edit';
      route();
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      if (e.status === 409) toast('That slug is already taken', true);
      else if (e.status === 404) toast('This application is no longer pending', true);
      else toast('Approve failed', true);
      btn.disabled = false;
    }
  }

  async function rejectApplication(id, btn){
    const note = prompt('Reject this application?\n\nOptional internal note (not sent to the applicant):');
    if (note === null) return;
    btn.disabled = true;
    try {
      await api('/admin/host-applications/' + id + '/reject', { method:'POST', body: { adminNote: note } });
      toast('Application rejected');
      renderApplications();
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      if (e.status === 404) toast('This application is no longer pending', true);
      else toast('Reject failed', true);
      btn.disabled = false;
    }
  }

  // ---------------------------------------------------------------------
  // Owner edits awaiting review (host_revisions)
  // ---------------------------------------------------------------------
  const REV_LABELS = {
    displayName: 'Name', bio: 'Bio / description', photoPath: 'Photo', instagramHandle: 'Instagram',
    expertise: 'Expertise', credentials: 'Credentials', seekingPlaceTypes: 'Seeking place types (internal)',
    region: 'Region', lodgingType: 'Lodging type', amenities: 'Amenities', capacityGuests: 'Capacity',
    houseRules: 'House rules', acceptsExperienceTypes: 'Accepts experience types (internal)',
    latitude: 'Latitude (exact, private)', longitude: 'Longitude (exact, private)', media: 'Gallery'
  };

  function revValueHtml(key, v){
    if (key === 'photoPath') return v ? '<span class="rev-thumbs">' + hostPhotoHtml(v) + '</span>' : '<i>—</i>';
    if (key === 'media'){
      return (v && v.length)
        ? '<span class="rev-thumbs">' + v.map(function(m){
            return '<span class="rev-thumb" title="' + esc(m.caption || '') + '"><img src="' + esc(imgSrc(m.photoPath)) + '" alt=""></span>';
          }).join('') + '</span><div class="app-meta">' + v.length + ' image(s)</div>'
        : '<i>none</i>';
    }
    if (Array.isArray(v)) return v.length ? v.map(esc).join('، ') : '<i>—</i>';
    if (v == null || v === '') return '<i>—</i>';
    return esc(String(v));
  }

  function revSame(key, a, b){
    if (key === 'media'){
      const norm = function(x){ return JSON.stringify((x || []).map(function(m){ return [m.photoPath, m.caption || null]; })); };
      return norm(a) === norm(b);
    }
    return JSON.stringify(a == null || a === '' ? null : a) === JSON.stringify(b == null || b === '' ? null : b);
  }

  async function renderRevisions(){
    app.innerHTML = shell('<div class="empty">Loading…</div>');
    bindLogout();
    let list = [];
    try {
      const qs = state.revisionsFilter ? ('?status=' + encodeURIComponent(state.revisionsFilter)) : '';
      list = (await api('/admin/host-revisions' + qs)).revisions;
    } catch(e){
      if (e.status === 401){ state.admin = null; renderLogin(); return; }
      toast('Could not load revisions', true);
    }
    const filterOptions = ['pending', 'approved', 'rejected', ''].map(function(v){
      return '<option value="' + v + '"' + (state.revisionsFilter === v ? ' selected' : '') + '>' + (v || 'All') + '</option>';
    }).join('');
    const cards = list.map(function(r){
      const keys = Object.keys(r.payload).filter(function(k){ return REV_LABELS[k]; });
      const changed = keys.filter(function(k){ return !revSame(k, r.current[k], r.payload[k]); });
      const rows = changed.map(function(k){
        return '<tr><td class="rev-k">' + esc(REV_LABELS[k]) + '</td>' +
          '<td class="rev-old">' + revValueHtml(k, r.current[k]) + '</td>' +
          '<td class="rev-new">' + revValueHtml(k, r.payload[k]) + '</td></tr>';
      }).join('');
      const pending = r.status === 'pending';
      return (
        '<div class="app-card" data-id="' + r.id + '">' +
          '<div class="app-top"><b>' + esc(r.host.displayName) + '</b>' +
            '<span class="badge ' + esc(r.host.kind) + '">' + esc(KIND_LABEL[r.host.kind] || r.host.kind) + '</span>' +
            '<span class="badge ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
            '<span class="app-meta">' + esc(String(r.createdAt || '').slice(0, 16).replace('T', ' ')) + '</span></div>' +
          '<div class="app-meta">Owner: ' + (r.owner ? esc(r.owner.firstName + ' ' + r.owner.lastName) + ' · <span dir="ltr">' + esc(r.owner.phone) + '</span>' : '<i>—</i>') +
            ' · <a href="#/hosts/' + r.host.id + '/edit">open profile</a></div>' +
          (changed.length
            ? '<table class="tours rev-table"><thead><tr><th>Field</th><th>Current</th><th>Proposed</th></tr></thead><tbody>' + rows + '</tbody></table>'
            : '<div class="app-meta"><i>No field differs from the live profile.</i></div>') +
          (r.adminNote ? '<div class="app-meta">Note: ' + esc(r.adminNote) + '</div>' : '') +
          (pending
            ? '<div class="app-actions"><button class="btn small primary rev-approve">Approve &amp; apply</button>' +
              '<button class="btn small danger rev-reject">Reject</button></div>'
            : '') +
        '</div>'
      );
    }).join('');
    app.innerHTML = shell(
      '<div class="list-head"><h1>بازبینی تغییرات</h1></div>' +
      '<div class="filter-row"><label>Status</label><select id="revFilter">' + filterOptions + '</select></div>' +
      (list.length ? cards : '<div class="empty">Nothing here.</div>')
    );
    bindLogout();
    document.getElementById('revFilter').addEventListener('change', function(){ state.revisionsFilter = this.value; renderRevisions(); });
    app.querySelectorAll('.rev-approve').forEach(function(btn){
      btn.addEventListener('click', async function(){
        btn.disabled = true;
        try {
          await api('/admin/host-revisions/' + Number(btn.closest('.app-card').dataset.id) + '/approve', { method:'POST', body: {} });
          toast('Applied to the profile');
          renderRevisions();
        } catch(e){
          if (e.status === 401){ state.admin = null; renderLogin(); return; }
          toast(e.status === 404 ? 'No longer pending' : 'Approve failed', true);
          btn.disabled = false;
        }
      });
    });
    app.querySelectorAll('.rev-reject').forEach(function(btn){
      btn.addEventListener('click', async function(){
        const note = prompt('Reject this edit?\n\nOptional note (the owner will see it):');
        if (note === null) return;
        btn.disabled = true;
        try {
          await api('/admin/host-revisions/' + Number(btn.closest('.app-card').dataset.id) + '/reject', { method:'POST', body: { adminNote: note } });
          toast('Rejected');
          renderRevisions();
        } catch(e){
          if (e.status === 401){ state.admin = null; renderLogin(); return; }
          toast(e.status === 404 ? 'No longer pending' : 'Reject failed', true);
          btn.disabled = false;
        }
      });
    });
  }

  // ---------------------------------------------------------------------
  // Experience proposals
  // ---------------------------------------------------------------------
  const PROPOSAL_STATUSES = ['new', 'in_discussion', 'accepted', 'declined'];
  async function renderProposals(){
    app.innerHTML = shell('<div class="empty">Loading…</div>');
    bindLogout();
    let list = [];
    try {
      const qs = state.proposalsFilter ? ('?status=' + encodeURIComponent(state.proposalsFilter)) : '';
      list = (await api('/admin/proposals' + qs)).proposals;
    } catch(e){

    }
